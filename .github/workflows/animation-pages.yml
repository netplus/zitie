name: Publish A1 animation preview

on:
  push:
    branches: [main]
    paths:
      - 'animation/**'
      - 'scripts/build_a3_animation.py'
      - 'data/B*.json'
      - 'data/teaching-source-policy.json'
      - 'data/artwork/terminal-overrides-v1.json'
      - 'deliverables/manifest.json'
      - 'deliverables/releases/v0.5.1/**'
      - '.github/workflows/animation-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zitie-animation-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild the released-PDF-matched A3 source pack
        run: |
          python -m pip install -r requirements.txt
          BATCHES="$(printf 'B%02d ' {1..21})"
          python scripts/acquire_vectors.py --batches $BATCHES
          python scripts/build_a3_animation.py --vectors build/vectors --output build/a3/book-pack.js
          node --check animation/ink-front-guard.js
          node --check animation/book-ui.js
          node --check animation/foundations/data.js
          node --check animation/foundations/app.js
          node --check animation/print/core.js
          node --check animation/print/app.js
          node --test animation/print/core.test.cjs
          node --test animation/foundations/f1.test.cjs
          node --test animation/foundations/f2-geometry.test.cjs
          node --test animation/foundations/formation.test.cjs
          node --test animation/foundations/f25-four-letters.test.cjs
          node --test animation/foundations/legibility-audit.test.cjs
          node --test animation/foundations/number-formation.test.cjs
          node --test animation/foundations/pinyin-classroom.test.cjs
          node --check animation/experiments/brush-gesture-model.js
          node --check animation/experiments/brush-motion-lab.js
          node --test animation/tests/a3-book.test.cjs animation/tests/a35-brush-motion.test.cjs animation/tests/a36-front-guard.test.cjs animation/tests/a37-book-pressure.test.cjs animation/tests/a38-pressure-layout.test.cjs animation/tests/p21a-reference.test.cjs animation/tests/p21b-trace.test.cjs animation/tests/p21c-progress.test.cjs animation/tests/p22a-whole-writing.test.cjs
      - name: Check source-backed animation examples
        run: node --test animation/tests/timeline.test.cjs animation/tests/precision.test.cjs animation/tests/motion.test.cjs animation/tests/pen-contact.test.cjs animation/tests/pen-kinematics.test.cjs animation/tests/source-onset.test.cjs animation/tests/pressure-model.test.cjs animation/tests/pressure-style.test.cjs animation/tests/stroke-primitives.test.cjs animation/tests/hardpen-model.test.cjs animation/tests/regular-kaishu-model.test.cjs animation/tests/kaishu-composition.test.cjs
      - name: Assemble minimal offline-compatible static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/animation _site/data/artwork _site/book
          cp animation/index.html animation/book.html animation/book-ui.js animation/main-layout.css animation/player.js animation/timeline.js animation/motion.js animation/samples.js animation/brush-union.js animation/ink-front-guard.js animation/pressure-style.js animation/hardpen-ink-union.js animation/hardpen-stage.js animation/gallery.js animation/ui.js animation/NOTICE.md _site/animation/
          cp build/a3/book-pack.js _site/animation/book-pack.js
          mkdir -p _site/animation/foundations
          cp animation/foundations/index.html animation/foundations/style.css animation/foundations/data.js animation/foundations/app.js _site/animation/foundations/
          mkdir -p _site/animation/print
          cp animation/print/index.html animation/print/style.css animation/print/core.js animation/print/app.js _site/animation/print/
          mkdir -p _site/animation/practice
          cp animation/practice/reference-stage.js animation/practice/practice-bridge.js animation/practice/practice.css animation/practice/trace-session.js animation/practice/trace-canvas.js animation/practice/pointer-input.js animation/practice/progress-controller.js animation/practice/whole-progress.js animation/practice/order-check.js animation/practice/storage.js _site/animation/practice/
          cp deliverables/releases/v0.5.1/zitie-v0.5.1-A4.pdf _site/book/zitie-v0.5.1-A4.pdf
          mkdir -p _site/animation/experiments
          cp animation/experiments/brush-gesture-model.js animation/experiments/brush-motion-lab.js animation/experiments/brush-motion-lab.html animation/experiments/gesture-data.js animation/experiments/pen-contact.js animation/experiments/pen-lab-engine.js animation/experiments/pen-kinematics.js animation/experiments/source-onset.js animation/experiments/pen-lab.html animation/experiments/pressure-model.js animation/experiments/pressure-lab.js animation/experiments/pressure-lab.html animation/experiments/stroke-primitives.js animation/experiments/stroke-grammar-lab.js animation/experiments/stroke-grammar-lab.html animation/experiments/hardpen-model.js animation/experiments/hardpen-lab.js animation/experiments/hardpen-lab.html animation/experiments/regular-kaishu-model.js animation/experiments/regular-kaishu-ink.js animation/experiments/regular-kaishu-stage.js animation/experiments/regular-kaishu-lab.js animation/experiments/regular-kaishu-lab.html animation/experiments/kaishu-composition.js animation/experiments/kaishu-composition-stage.js animation/experiments/kaishu-composition-lab.js animation/experiments/kaishu-composition-lab.html _site/animation/experiments/
          cp data/artwork/ARPHICPL.TXT _site/data/artwork/ARPHICPL.TXT
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN"><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0;url=./animation/book.html">
          <title>循序渐进汉字部首 · 笔顺动画预览</title>
          </head><body>
          <p><a href="./animation/book.html">进入与正式 PDF 对应的201字毛笔笔顺教学动画</a></p>
          </body></html>
          HTML
          touch _site/.nojekyll
          test -s _site/animation/index.html
          test -s _site/animation/book.html
          test -s _site/animation/book-ui.js
          test -s _site/animation/main-layout.css
          grep -q 'href="./main-layout.css"' _site/animation/book.html
          test -s _site/animation/book-pack.js
          test -s _site/animation/foundations/index.html
          test -s _site/animation/foundations/style.css
          test -s _site/animation/foundations/data.js
          test -s _site/animation/foundations/app.js
          test -s _site/animation/print/index.html
          test -s _site/animation/print/style.css
          test -s _site/animation/print/core.js
          test -s _site/animation/print/app.js
          grep -q 'href="./print/index.html"' _site/animation/book.html
          grep -q 'href="./foundations/index.html"' _site/animation/book.html
          test -s _site/animation/practice/reference-stage.js
          test -s _site/animation/practice/practice-bridge.js
          test -s _site/animation/practice/practice.css
          test -s _site/animation/practice/trace-session.js
          test -s _site/animation/practice/trace-canvas.js
          test -s _site/animation/practice/pointer-input.js
          test -s _site/animation/practice/progress-controller.js
          test -s _site/animation/practice/whole-progress.js
          test -s _site/animation/practice/order-check.js
          test -s _site/animation/practice/storage.js
          grep -q 'id="practiceOrderResult"' _site/animation/book.html
          if grep -q 'id="practiceAccept"' _site/animation/book.html; then
            echo 'Per-stroke confirmation must not ship' >&2
            exit 1
          fi
          grep -q 'id="practiceUndo"' _site/animation/book.html
          grep -q 'id="practiceInk"' _site/animation/book.html
          grep -q 'id="practiceOverlay"' _site/animation/book.html
          test -s _site/book/zitie-v0.5.1-A4.pdf
          test -s _site/animation/player.js
          test -s _site/animation/timeline.js
          test -s _site/animation/motion.js
          test -s _site/animation/samples.js
          test -s _site/animation/brush-union.js
          test -s _site/animation/ink-front-guard.js
          test -s _site/animation/pressure-style.js
          test -s _site/animation/experiments/pressure-model.js
          test -s _site/animation/experiments/gesture-data.js
          grep -q 'data-pen-style="simulated"' _site/animation/book.html
          grep -q 'data-pen-style="stable"' _site/animation/book.html
          grep -q 'id="writingStage"' _site/animation/book.html
          grep -q 'class="pressureBox"' _site/animation/book.html
          test -s _site/animation/hardpen-ink-union.js
          test -s _site/animation/hardpen-stage.js
          test -s _site/animation/gallery.js
          test -s _site/animation/ui.js
          test -s _site/animation/experiments/brush-gesture-model.js
          test -s _site/animation/experiments/brush-motion-lab.js
          test -s _site/animation/experiments/brush-motion-lab.html
          test -s _site/animation/experiments/pen-lab.html
          test -s _site/animation/experiments/pen-contact.js
          test -s _site/animation/experiments/pen-lab-engine.js
          test -s _site/animation/experiments/pen-kinematics.js
          test -s _site/animation/experiments/source-onset.js
          test -s _site/animation/experiments/gesture-data.js
          test -s _site/animation/experiments/pressure-model.js
          test -s _site/animation/experiments/pressure-lab.js
          test -s _site/animation/experiments/pressure-lab.html
          test -s _site/animation/experiments/stroke-primitives.js
          test -s _site/animation/experiments/stroke-grammar-lab.js
          test -s _site/animation/experiments/stroke-grammar-lab.html
          test -s _site/animation/experiments/hardpen-model.js
          test -s _site/animation/experiments/hardpen-lab.js
          test -s _site/animation/experiments/hardpen-lab.html
          test -s _site/animation/experiments/regular-kaishu-model.js
          test -s _site/animation/experiments/regular-kaishu-ink.js
          test -s _site/animation/experiments/regular-kaishu-stage.js
          test -s _site/animation/experiments/regular-kaishu-lab.js
          test -s _site/animation/experiments/regular-kaishu-lab.html
          test -s _site/animation/experiments/kaishu-composition.js
          test -s _site/animation/experiments/kaishu-composition-stage.js
          test -s _site/animation/experiments/kaishu-composition-lab.js
          test -s _site/animation/experiments/kaishu-composition-lab.html
          test -s _site/data/artwork/ARPHICPL.TXT
          if grep -R -E '(https?:)?//(cdn\.|unpkg\.|fonts\.googleapis)' _site/animation; then
            echo 'Unexpected runtime CDN dependency' >&2
            exit 1
          fi
      - name: Detect GitHub Pages enablement
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::GitHub Pages is not enabled (or the workflow cannot query it). To publish, open repository Settings > Pages, choose GitHub Actions as the build and deployment source, then manually run this workflow.'
          fi
      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
