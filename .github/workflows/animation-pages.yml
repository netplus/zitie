name: Publish A1 animation preview

on:
  push:
    branches: [main]
    paths:
      - 'animation/**'
      - '.github/workflows/animation-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zitie-animation-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source-backed animation examples
        run: node --test animation/tests/timeline.test.cjs
      - name: Assemble minimal offline-compatible static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/animation
          cp animation/index.html animation/player.js animation/timeline.js animation/samples.js _site/animation/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN"><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0;url=./animation/">
          <title>循序渐进汉字部首 · 笔顺动画预览</title>
          </head><body>
          <p><a href="./animation/">进入笔顺教学动画工程预览</a></p>
          </body></html>
          HTML
          touch _site/.nojekyll
          test -s _site/animation/index.html
          test -s _site/animation/player.js
          test -s _site/animation/timeline.js
          test -s _site/animation/samples.js
          if grep -R -E '(https?:)?//(cdn\.|unpkg\.|fonts\.googleapis)' _site/animation; then
            echo 'Unexpected runtime CDN dependency' >&2
            exit 1
          fi
      - name: Detect GitHub Pages enablement
        id: pages
        env:
          GH_TOKEN: ${{{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::GitHub Pages is not enabled (or the workflow cannot query it). To publish, open repository Settings > Pages, choose GitHub Actions as the build and deployment source, then manually run this workflow.'
          fi
      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
