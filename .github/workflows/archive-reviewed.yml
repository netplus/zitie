name: Archive reviewed PDF bytes
on:
  push:
    paths:
      - maintenance/archive-request.json
permissions:
  contents: write
  actions: read
concurrency:
  group: reviewed-pdf-archive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'netplus/zitie' && startsWith(github.ref, 'refs/heads/feat/')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read reviewed artifact identity
        id: request
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          r=json.loads(Path('maintenance/archive-request.json').read_text())
          assert isinstance(r['run_id'],int) and r['run_id']>0
          assert re.fullmatch(r'[A-Za-z0-9_.-]+',r['artifact_name'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run_id='+str(r['run_id'])+'\n')
              f.write('artifact_name='+r['artifact_name']+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.request.outputs.run_id }}
          name: ${{ steps.request.outputs.artifact_name }}
          path: archive-download
      - run: python -m pip install -r requirements.txt
      - name: Verify identities and preserve PDF bytes
        run: |
          python scripts/archive_reviewed.py
          python scripts/verify_deliverables.py
      - name: Commit only deliverables to the feature branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deliverables/
          git commit -m 'docs: archive reviewed PDF version and checksums'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
