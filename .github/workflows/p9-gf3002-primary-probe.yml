name: P9 GF3002 official 20902-character original PDF source probe

on:
  pull_request:
    paths:
      - 'scripts/p9_GF3002_original_pdf_probe.py'
      - '.github/workflows/p9-gf3002-primary-probe.yml'
  push:
    branches:
      - feat/p9-gf3002-primary-lookup-20261027
    paths:
      - 'scripts/p9_GF3002_original_pdf_probe.py'
      - '.github/workflows/p9-gf3002-primary-probe.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  probe-full-official-gf3002:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install one locked original-PDF parser
        run: python -m pip install 'PyMuPDF==1.26.7'
      - name: Download ONLY actual official Ministry GF3002 attachment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/p9-gf3002
          curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --connect-timeout 15 \
            --max-time 130 \
            -A 'Mozilla/5.0' \
            'https://www.moe.gov.cn/jyb_sjzl/ziliao/A19/201001/W020150902457900316281.pdf' \
            --output build/p9-gf3002/GF3002-ministry-original.pdf
          test "$(head -c 5 build/p9-gf3002/GF3002-ministry-original.pdf)" = "%PDF-"
      - name: Inspect original table samples and 37 exact rare UCS rows
        run: |
          python scripts/p9_GF3002_original_pdf_probe.py \
            --source build/p9-gf3002/GF3002-ministry-original.pdf \
            --out build/p9-gf3002/qa
      - name: Guard frozen original Chinese handwriting book
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path=Path('deliverables/releases/v0.5.1/zitie-v0.5.1-A4.pdf')
          assert hashlib.sha256(path.read_bytes()).hexdigest()==             '7fb6c7227258903828098c29368f0412a7b8621260d3d5f8ad91f45beba5eb90'
          PY
      - name: Upload original source-page samples and UCS mapping for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P9-GF3002-actual-ministry-primary-source-37-lookup-NOT-APPROVED
          path: build/p9-gf3002/qa
          retention-days: 14
          if-no-files-found: warn
