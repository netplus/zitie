name: Q1 temporary exact PDF blob staging
on:
  push:
    branches:
      - maintenance/q1-rc3-stage-20261008
    paths:
      - .github/workflows/q1-stage-blobs.yml
permissions:
  contents: read
jobs:
  stage-reviewed-pdf-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic PDF reconstruction dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'PyMuPDF==1.26.7'
          sudo apt-get update -qq
          sudo apt-get install -y zstd fonts-arphic-gkai00mp fonts-arphic-uming
      - name: Stage 25 exact Git blobs without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/q1_stage_exact_objects.py --stage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q1-rc3-blob-stage-report
          path: build/q1-stage/q1-stage-report.json
          retention-days: 7
