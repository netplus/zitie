name: One-shot archive v0.4.0 RC1

on:
  push:
    branches:
      - feat/p7-v0.4.0-rc1-archive-20261007

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: ${{ !contains(github.event.head_commit.message, '[archive-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ID: "11460128190"
      EXPECTED_SHA256: "fb88257a792c39aa147bb6074fd00656bd7c3c7458dd12c4b6750ddb65498bff"
      EXPECTED_BYTES: "3756330"
      SOURCE_COMMIT: "5ab536f32ac7f1c2909236e0261d3f8db745f6a5"
      SOURCE_RUN: "37569826763"
      TARGET_PATH: "deliverables/drafts/v0.4.0-rc1/B01-B21_with_preface_toc_appendices_rc1_A4.pdf"
      REVIEW_RECORD: "reviews/P7-RC1-visual-QA-20261007.md"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download reviewed RC1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/rc1.zip
          mkdir -p /tmp/rc1
          unzip -q /tmp/rc1.zip -d /tmp/rc1
          test -f /tmp/rc1/B01-B21_with_preface_toc_appendices_rc1_A4.pdf
      - name: Verify and stage RC1
        run: |
          python -m pip install pypdf==5.9.0
          python - <<'PY'
          import hashlib, os, json
          from pathlib import Path
          from pypdf import PdfReader
          src=Path('/tmp/rc1/B01-B21_with_preface_toc_appendices_rc1_A4.pdf')
          raw=src.read_bytes()
          got_hash=hashlib.sha256(raw).hexdigest()
          got_bytes=len(raw)
          pages=len(PdfReader(str(src)).pages)
          assert got_hash==os.environ['EXPECTED_SHA256'], (got_hash, os.environ['EXPECTED_SHA256'])
          assert got_bytes==int(os.environ['EXPECTED_BYTES']), (got_bytes, os.environ['EXPECTED_BYTES'])
          assert pages==276, pages

          dst=Path(os.environ['TARGET_PATH'])
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_bytes(raw)

          manifest=Path('deliverables/manifest.json')
          data=json.loads(manifest.read_text(encoding='utf-8'))
          path=os.environ['TARGET_PATH']
          if any(x.get('path')==path for x in data['artifacts']):
              raise SystemExit('RC1 path already exists in manifest')
          data['artifacts'].append({
              'path': path,
              'title': '《循序渐进汉字部首字帖》v0.4.0 RC1发布候选稿',
              'version': '0.4.0-rc1',
              'status': 'release_candidate',
              'batch': 'B01-B21',
              'pages': pages,
              'bytes': got_bytes,
              'sha256': got_hash,
              'source_commit': os.environ['SOURCE_COMMIT'],
              'workflow_run_id': int(os.environ['SOURCE_RUN']),
              'artifact_id': int(os.environ['ARTIFACT_ID']),
              'review_record': os.environ['REVIEW_RECORD'],
              'release_eligible': False
          })
          manifest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit RC1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/archive-v040-rc1-once.yml
          git add deliverables/manifest.json "${TARGET_PATH}"
          git commit -m "[archive-bot] P7: archive v0.4.0 RC1"
          git push origin "HEAD:${GITHUB_REF_NAME}"
