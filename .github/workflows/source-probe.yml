name: Reference acquisition
on:
  push:
    paths:
      - '.github/workflows/source-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch pinned public references without changing editorial status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p references
          : > references/SHA256SUMS.txt
          : > references/retrieval.tsv

          fetch_verified() {
            name="$1"
            url="$2"
            expected="$3"
            if ! curl --fail --location --retry 2 --retry-delay 2 --max-time 180 "$url" -o "references/$name"; then
              rm -f "references/$name"
              printf 'FAILED_FETCH\t%s\t%s\n' "$name" "$url" >> references/retrieval.tsv
              return 1
            fi

            actual="$(sha256sum "references/$name" | awk '{print $1}')"
            bytes="$(stat -c '%s' "references/$name")"
            printf '%s  %s\n' "$actual" "$name" >> references/SHA256SUMS.txt

            if [ "$actual" != "$expected" ]; then
              printf 'FAILED_SHA256\t%s\t%s\t%s\t%s\t%s\n' "$name" "$bytes" "$expected" "$actual" "$url" >> references/retrieval.tsv
              rm -f "references/$name"
              return 1
            fi

            printf 'OK\t%s\t%s\t%s\t%s\n' "$name" "$bytes" "$actual" "$url" >> references/retrieval.tsv
          }

          fetch_verified gf0023-2020.pdf \
            'https://raw.githubusercontent.com/zispace/hanzi-docs/d26705ffc52b81b6e1a45483c7b591f62962f49f/%E4%B8%AD%E5%9B%BD%E5%A4%A7%E9%99%86/2-GF-%E8%AF%AD%E8%A8%80%E6%96%87%E5%AD%97%E8%A7%84%E8%8C%83/20201123-GF%200023-2020%E3%80%8A%E9%80%9A%E7%94%A8%E8%A7%84%E8%8C%83%E6%B1%89%E5%AD%97%E7%AC%94%E9%A1%BA%E8%A7%84%E8%8C%83%E3%80%8B.pdf' \
            '0ff0890afc34c5e486edeebafb05350dec69a7bf0d1d75044d7d3f7b722ec3d0'

          fetch_verified stroke-order-1997.pdf \
            'https://raw.githubusercontent.com/zispace/hanzi-docs/d26705ffc52b81b6e1a45483c7b591f62962f49f/%E4%B8%AD%E5%9B%BD%E5%A4%A7%E9%99%86/1-%E6%97%A7%E7%89%88%E5%AD%97%E8%A1%A8/19970407-%E7%8E%B0%E4%BB%A3%E6%B1%89%E8%AF%AD%E9%80%9A%E7%94%A8%E5%AD%97%E7%AC%94%E9%A1%BA%E8%A7%84%E8%8C%83.pdf' \
            'ca8a0139744cf8105cb7e4ae7464ebc68cb76310b5a29e7cf004b2489a35ae65'

          fetch_verified gf2001-2001.pdf \
            'https://raw.githubusercontent.com/zispace/hanzi-docs/d26705ffc52b81b6e1a45483c7b591f62962f49f/%E4%B8%AD%E5%9B%BD%E5%A4%A7%E9%99%86/2-GF-%E8%AF%AD%E8%A8%80%E6%96%87%E5%AD%97%E8%A7%84%E8%8C%83/20011219-GF%202001-2001%E3%80%8AGB%2013000.1%20%E5%AD%97%E7%AC%A6%E9%9B%86%E6%B1%89%E5%AD%97%E6%8A%98%E7%AC%94%E8%A7%84%E8%8C%83%E3%80%8B-%E5%8E%8B%E7%BC%A9%E7%89%88.pdf' \
            '68a1420580a7eedde79eeb55b91b6b2ff10ef9155d98633ccc712838f04e9b14'

          fetch_verified gf0011-2009.pdf \
            'https://raw.githubusercontent.com/zispace/hanzi-docs/d26705ffc52b81b6e1a45483c7b591f62962f49f/%E4%B8%AD%E5%9B%BD%E5%A4%A7%E9%99%86/2-GF-%E8%AF%AD%E8%A8%80%E6%96%87%E5%AD%97%E8%A7%84%E8%8C%83/20090112-GF%200011-2009%E3%80%8A%E6%B1%89%E5%AD%97%E9%83%A8%E9%A6%96%E8%A1%A8%E3%80%8B.pdf' \
            'c8ccfcc51400bb04eddab256017a67ed20def41ee29f8c06e2c54ddbb76b1f48'
          # GF 3002-1999 mirror bytes are now pinned after the successful
          # 2026-10-06 probe. Note: this mirror is an 8-page abridged extract,
          # so byte verification does not make it usable for P1 residual closure.
          fetch_verified gf3002-1999.pdf \
            'https://raw.githubusercontent.com/zispace/hanzi-docs/d26705ffc52b81b6e1a45483c7b591f62962f49f/%E4%B8%AD%E5%9B%BD%E5%A4%A7%E9%99%86/2-GF-%E8%AF%AD%E8%A8%80%E6%96%87%E5%AD%97%E8%A7%84%E8%8C%83/19991001-GF%203002-1999%E3%80%8AGB13000.1%E5%AD%97%E7%AC%A6%E9%9B%86%E6%B1%89%E5%AD%97%E7%AC%94%E9%A1%BA%E8%A7%84%E8%8C%83%E3%80%8B.pdf' \
            'cb5cb74f108dafed41a3583bc8d33d8dd318d1a21d714923c0f1ced89443cf3e'

          # P1 residual normative-source probe. This branch-only probe records
          # bytes/SHA256 for GB/T 25741-2010 Appendix C before final digest pinning.
          # Retrieval success alone does not grant reviewed status.
          probe_name='gbt25741-2010-appendix-c.pdf'
          probe_url='https://raw.githubusercontent.com/zispace/hanzi-docs/d26705ffc52b81b6e1a45483c7b591f62962f49f/%E4%B8%AD%E5%9B%BD%E5%A4%A7%E9%99%86/2-GB-%E5%9B%BD%E5%AE%B6%E6%A0%87%E5%87%86/20110114-GBT%2025741-2010%E3%80%8A%E4%BF%A1%E6%81%AF%E6%8A%80%E6%9C%AF%20%E6%B1%89%E5%AD%97%E7%BC%96%E7%A0%81%E5%AD%97%E7%AC%A6%E9%9B%86%20%E6%B1%89%E5%AD%97%E9%83%A8%E9%A6%96%E5%BA%8F%E5%92%8C%E7%AC%94%E9%A1%BA%E5%BA%8F%E3%80%8B-%E9%99%84%E5%BD%95C%EF%BC%88%E5%9B%BE%E7%89%87%E5%8E%8B%E7%BC%A9%EF%BC%89.pdf'
          curl --fail --location --retry 2 --retry-delay 2 --max-time 180 "$probe_url" -o "references/$probe_name"
          probe_sha="$(sha256sum "references/$probe_name" | awk '{print $1}')"
          probe_bytes="$(stat -c '%s' "references/$probe_name")"
          printf '%s  %s\n' "$probe_sha" "$probe_name" >> references/SHA256SUMS.txt
          printf 'PROBE_OK\t%s\t%s\t%s\t%s\n' "$probe_name" "$probe_bytes" "$probe_sha" "$probe_url" >> references/retrieval.tsv
          printf '%s\n' \
            'Reference acquisition only.' \
            'Every fetched file is pinned to a public GitHub commit and must match the expected SHA256.' \
            'This workflow does not mark any page or field as reviewed.' \
            'Temporary reference artifacts are for source verification/review only and are not book deliverables.' \
            'Do not commit or redistribute source PDFs as deliverables.' \
            > references/README.txt

      - name: Store temporary verified reference bundle
        uses: actions/upload-artifact@v4
        with:
          name: normative-reference-acquisition
          path: references/
          retention-days: 7
          if-no-files-found: error
