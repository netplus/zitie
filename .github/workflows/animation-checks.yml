name: A1 animation checks
on:
  push:
    paths:
      - 'animation/**'
      - 'scripts/a1_audit.py'
      - 'scripts/a1_browser_smoke.sh'
      - 'scripts/build_a3_animation.py'
      - '.github/workflows/animation-checks.yml'
  pull_request:
    paths:
      - 'animation/**'
      - 'scripts/a1_audit.py'
      - 'scripts/a1_browser_smoke.sh'
      - 'scripts/build_a3_animation.py'
      - '.github/workflows/animation-checks.yml'
permissions:
  contents: read
jobs:
  svg-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check JavaScript syntax and canonical stroke data
        run: |
          node --check animation/motion.js
          node --check animation/timeline.js
          node --check animation/player.js
          node --check animation/hardpen-ink-union.js
          node --check animation/hardpen-stage.js
          node --check animation/brush-union.js
          node --check animation/ink-front-guard.js
          node --check animation/pressure-style.js
          node --check animation/experiments/gesture-data.js
          node --check animation/experiments/pen-contact.js
          node --check animation/experiments/pen-lab-engine.js
          node --check animation/experiments/pen-kinematics.js
          node --check animation/experiments/source-onset.js
          node --check animation/experiments/pressure-model.js
          node --check animation/experiments/pressure-lab.js
          node --check animation/experiments/stroke-primitives.js
          node --check animation/experiments/stroke-grammar-lab.js
          node --check animation/experiments/hardpen-model.js
          node --check animation/experiments/hardpen-lab.js
          node --check animation/experiments/regular-kaishu-model.js
          node --check animation/experiments/regular-kaishu-ink.js
          node --check animation/experiments/regular-kaishu-stage.js
          node --check animation/experiments/regular-kaishu-lab.js
          node --check animation/experiments/kaishu-composition.js
          node --check animation/experiments/kaishu-composition-stage.js
          node --check animation/experiments/kaishu-composition-lab.js
          node --check animation/experiments/brush-gesture-model.js
          node --check animation/experiments/brush-motion-lab.js
          node --check animation/gallery.js
          node --check animation/ui.js
          node --check animation/book-ui.js
          node --check animation/practice/progress-controller.js
          node --check animation/practice/whole-progress.js
          node --check animation/practice/order-check.js
          node --check animation/tests/cdp-wait-result.mjs
          node --check animation/practice/storage.js
          node --test animation/tests/p21c-progress.test.cjs
          node --check animation/samples.js
          node --test animation/tests/timeline.test.cjs animation/tests/precision.test.cjs animation/tests/motion.test.cjs animation/tests/pen-contact.test.cjs animation/tests/pen-kinematics.test.cjs animation/tests/source-onset.test.cjs animation/tests/pressure-model.test.cjs animation/tests/pressure-style.test.cjs animation/tests/stroke-primitives.test.cjs animation/tests/hardpen-model.test.cjs animation/tests/regular-kaishu-model.test.cjs animation/tests/kaishu-composition.test.cjs animation/tests/a35-brush-motion.test.cjs
      - name: Install CJK fallback solely for screenshot QA (never bundle font)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-uming fontconfig
      - name: Prepare headless Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Exercise true animated reveal and controller in a browser
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: bash scripts/a1_browser_smoke.sh
      - name: Render visual QA frame sheet (source-backed, no pedagogical approval)
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/a1
          python3 -m http.server 18766 --bind 127.0.0.1 > build/a1/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18766/animation/index.html',timeout=1)" >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          options=(--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-timer-throttling --window-size=1550,1620 --virtual-time-budget=16000)
          url="http://127.0.0.1:18766/animation/tests/frame-gallery.html"
          timeout 75 "$CHROME_BIN" "${options[@]}" --dump-dom "$url" > build/a1/gallery-dom.html
          grep -q 'data-result="PASS"' build/a1/gallery-dom.html
          timeout 75 "$CHROME_BIN" "${options[@]}" --screenshot="$(pwd)/build/a1/motion-frame-gallery.png" "$url" >/dev/null
          test -s build/a1/motion-frame-gallery.png
      - name: Verify pixel-by-pixel monotone ink growth on all sampled strokes
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/a1
          python3 -m http.server 18767 --bind 127.0.0.1 > build/a1/fill-integrity-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18767/animation/index.html',timeout=1)" >/dev/null 2>&1; then break; fi
            sleep .2
          done
          options=(--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-timer-throttling --disable-renderer-backgrounding --window-size=1300,1500 --virtual-time-budget=90000)
          timeout 180 "$CHROME_BIN" "${options[@]}" --dump-dom "http://127.0.0.1:18767/animation/tests/fill-integrity.html" > build/a1/fill-integrity-result.html
          if ! grep -q 'data-result="PASS"' build/a1/fill-integrity-result.html; then
            echo "A1 fill pixel-integrity check failed" >&2
            grep -o 'FAIL:[^<]*' build/a1/fill-integrity-result.html | head -n 8 >&2 || true
            exit 1
          fi
          echo "PASS: pixel-by-pixel monotone ink fill, no disconnected artifacts, original contour preserved"
      - name: Verify isolated A1.4 pen-contact A/B laboratory in Chromium
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/a1
          python3 -m http.server 18768 --bind 127.0.0.1 > build/a1/pen-lab-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18768/animation/experiments/pen-lab.html',timeout=1)" >/dev/null 2>&1; then break; fi
            sleep .2
          done
          options=(--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-timer-throttling --disable-renderer-backgrounding --window-size=1400,1750 --virtual-time-budget=60000)
          timeout 160 "$CHROME_BIN" "${options[@]}" --dump-dom "http://127.0.0.1:18768/animation/tests/pen-lab-smoke.html" > build/a1/pen-lab-smoke-dom.html
          if ! grep -q 'data-result="PASS"' build/a1/pen-lab-smoke-dom.html; then
            echo 'FAIL: A1.4 pen-contact browser audit' >&2
            grep -o 'FAIL:[^<]*' build/a1/pen-lab-smoke-dom.html | head -n 12 >&2 || true
            exit 1
          fi
          echo 'PASS: A1.4 six-glyph source-clipped synthetic nib A/B audit'
          python3 - <<'PY'
          import html
          import json
          from pathlib import Path
          import re
          raw = Path('build/a1/pen-lab-smoke-dom.html').read_text(encoding='utf-8')
          match = re.search(r'<pre id="result">(\{.*?\})</pre>', raw, re.S)
          if not match:
              raise SystemExit('Missing structured pen laboratory metrics')
          data = json.loads(html.unescape(match.group(1)))
          assert data['result'] == 'PASS'
          assert data['glyphs'] == 6 and data['sampledFrames'] == 60
          assert data['sourcePixelLoss'] == 0
          assert data['outsideOriginalContourPixels'] == 0
          assert data['invalidContactStates'] == 0
          assert data['retimedFrames'] >= 3
          assert data['worstExperimentalTerminalGapPercent'] < 10
          assert data['yiComparedFrames'] >= 5
          assert data['yiTrailingUnfilledPixels'] == 0
          assert data['yiTerminalGapPercent'] < 1.25
          Path('build/a1/pen-lab-metrics.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8')
          print('A1.4 metric gate:', json.dumps({
              key: data[key] for key in (
                  'sampledFrames','retimedFrames','sourcePixelLoss',
                  'outsideOriginalContourPixels','worstExperimentalTerminalGapPercent',
                  'yiComparedFrames','yiTrailingUnfilledPixels','yiTerminalGapPercent')
          }))
          PY
          # The previous A1.4.2 coverage QA compared only ~10% behind
          # the pen and missed upper-left gray gaps at 3-5% spatial travel.
          # Guard source-aligned start-cap pixels at 512, 768 and 1024 px.
          timeout 120 "$CHROME_BIN" "${options[@]}" --dump-dom "http://127.0.0.1:18768/animation/tests/yi-start-contact.html" > build/a1/yi-start-contact-result.html
          if ! grep -q 'data-result="PASS"' build/a1/yi-start-contact-result.html; then
            echo 'FAIL: delayed 一 upper-left start-cap fill regression' >&2
            grep -o 'FAIL:[^<]*' build/a1/yi-start-contact-result.html | head -n 8 >&2 || true
            exit 1
          fi
          python3 - <<'PY'
          import html, json, re
          from pathlib import Path
          raw=Path('build/a1/yi-start-contact-result.html').read_text(encoding='utf-8')
          match=re.search(r'<pre id="result">(\{.*?\})</pre>',raw,re.S)
          if not match:
              raise SystemExit('Missing structured early pen cap report')
          data=json.loads(html.unescape(match.group(1)))
          assert data['result']=='PASS'
          assert data['resolutions']==[512,768,1024]
          assert data['frames']==72
          assert data['earlySourceComparisons']>=33
          assert data['projectedComparisons']>=25
          assert data['projectedMissingPixels']==0
          assert data['projectedSourcePixels']>160
          assert data['sourceOriginProjection'] < -7
          assert data['upperLeftMissingPixels']==0
          assert data['sourceMissingPixels']==0
          assert data['vanishedPixels']==0
          assert data['outsideSourcePixels']==0
          Path('build/a1/yi-start-contact-metrics.json').write_text(
              json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PASS: A1.4.4 directional source-probed 一 start cap 512/768/1024px,',
                data['earlySourceComparisons'],'comparisons, 0 delayed pixels')
          PY
          onset_sheet="http://127.0.0.1:18768/animation/tests/yi-directional-frame-sheet.html"
          timeout 120 "$CHROME_BIN" "${options[@]}" --dump-dom "$onset_sheet" > build/a1/yi-directional-frames-dom.html
          if ! grep -q 'data-result="PASS"' build/a1/yi-directional-frames-dom.html; then
            echo 'FAIL: source-derived 一 pen-tip visual sheet did not fully render' >&2
            grep -o 'FAIL:[^<]*' build/a1/yi-directional-frames-dom.html | head -n 8 >&2 || true
            exit 1
          fi
          timeout 120 "$CHROME_BIN" "${options[@]}" --window-size=1850,1600 \
            --screenshot="$(pwd)/build/a1/yi-directional-start-cap.png" "$onset_sheet" >/dev/null
          test -s build/a1/yi-directional-start-cap.png
          timeout 120 "$CHROME_BIN" "${options[@]}" --dump-dom "http://127.0.0.1:18768/animation/tests/pen-lab-frames.html" > build/a1/pen-lab-frames-dom.html
          grep -q 'data-result="PASS"' build/a1/pen-lab-frames-dom.html
          timeout 120 "$CHROME_BIN" "${options[@]}" --window-size=1850,1620 --screenshot="$(pwd)/build/a1/pen-lab-ab-frames.png" "http://127.0.0.1:18768/animation/tests/pen-lab-frames.html" >/dev/null
          test -s build/a1/pen-lab-ab-frames.png
      - name: Verify 2x DPI onset coverage and mobile pen visibility in Chromium
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/a1
          python3 -m http.server 18769 --bind 127.0.0.1 > build/a1/hidpi-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18769/animation/experiments/pen-lab.html',timeout=1)" >/dev/null 2>&1; then break; fi
            sleep .2
          done
          dpi=(--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-timer-throttling --force-device-scale-factor=2 --virtual-time-budget=90000)
          timeout 160 "$CHROME_BIN" "${dpi[@]}" --window-size=1400,1750 \
            --dump-dom 'http://127.0.0.1:18769/animation/tests/yi-start-contact.html?mode=hidpi' \
            > build/a1/yi-start-contact-hidpi-dom.html
          grep -q 'data-result="PASS"' build/a1/yi-start-contact-hidpi-dom.html
          python3 - <<'PY'
          from pathlib import Path
          import html, json, re
          raw = Path('build/a1/yi-start-contact-hidpi-dom.html').read_text(encoding='utf-8')
          match = re.search(r'<pre id="result">(\{.*?\})</pre>', raw, re.S)
          if not match:
              raise SystemExit('Missing structured 2x retina raster audit')
          data = json.loads(html.unescape(match.group(1)))
          assert data['result'] == 'PASS' and data['mode'] == 'hidpi'
          assert abs(data['devicePixelRatio'] - 2) < .06
          assert data['cssSizes'] == [310, 410, 520]
          assert data['resolutions'] == [620, 820, 1040] and data['frames'] == 72
          assert data['earlySourceComparisons'] >= 33
          assert data['projectedComparisons'] >= 25
          assert data['projectedMissingPixels'] == 0
          assert data['vanishedPixels'] == 0 and data['outsideSourcePixels'] == 0
          assert data['sourceMissingPixels'] == 0 and data['upperLeftMissingPixels'] == 0
          Path('build/a1/yi-start-contact-hidpi-metrics.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('PASS: actual 2x Chrome DPR, 72 frames, 0 source-cap underfill')
          PY
          timeout 80 "$CHROME_BIN" "${dpi[@]}" --window-size=450,1000 \
            --dump-dom 'http://127.0.0.1:18769/animation/tests/pen-lab-mobile.html' \
            > build/a1/pen-lab-mobile-dom.html
          if ! grep -q 'data-result="PASS"' build/a1/pen-lab-mobile-dom.html; then
            echo 'FAIL: A1.4 responsive mobile DPI smoke' >&2
            grep -o 'FAIL:[^<]*' build/a1/pen-lab-mobile-dom.html | head -n 8 >&2 || true
            exit 1
          fi
          timeout 80 "$CHROME_BIN" "${dpi[@]}" --window-size=1400,1450 \
            --screenshot="$(pwd)/build/a1/yi-directional-start-cap-hidpi.png" \
            'http://127.0.0.1:18769/animation/tests/yi-directional-frame-sheet.html' >/dev/null
          test -s build/a1/yi-directional-start-cap-hidpi.png
      - name: Compare stable round cursor against source-clipped ink frontier
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/a1
          python3 -m http.server 18770 --bind 127.0.0.1 > build/a1/frontier-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18770/animation/index.html',timeout=1)" >/dev/null 2>&1; then break; fi
            sleep .2
          done
          options=(--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-timer-throttling --virtual-time-budget=100000 --window-size=1300,1400)
          for size in 512 1024; do
            timeout 175 "$CHROME_BIN" "${options[@]}" --dump-dom \
              "http://127.0.0.1:18770/animation/tests/stable-tip-frontier.html?raster=$size" \
              > "build/a1/stable-tip-frontier-$size-dom.html"
            if ! grep -q 'data-result="PASS"' "build/a1/stable-tip-frontier-$size-dom.html"; then
              echo "FAIL: stable cursor/front comparison at $size px" >&2
              grep -o 'FAIL:[^<]*' "build/a1/stable-tip-frontier-$size-dom.html" | head -n 8 >&2 || true
              exit 1
            fi
          done
          python3 - <<'PY'
          import html,json,re
          from pathlib import Path
          for size in (512,1024):
              raw=Path(f'build/a1/stable-tip-frontier-{size}-dom.html').read_text(encoding='utf-8')
              match=re.search(r'<pre id="result">(\{.*?\})</pre>',raw,re.S)
              if not match:
                  raise SystemExit(f'Missing structured {size}px cursor/frontier audit')
              report=json.loads(html.unescape(match.group(1)))
              assert report['result']=='PASS' and report['frames']==50
              assert report['resolution']==size
              assert report['exactTip']==50 and report['regressions']==0
              assert report['stableAheadSum']<=report['legacyAheadSum']
              assert report['improvements']>=3 and report['offsetFrames']>=3
              assert report['markerOutside']==0, 'Circle marker must stay on written red ink'
              Path(f'build/a1/stable-tip-frontier-{size}-metrics.json').write_text(
                json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print(f'PASS {size}px: old visible ink lead',
                    report['legacyAheadSum'],'new',report['stableAheadSum'],
                    'improved frames',report['improvements'],
                    'marker gray gaps',report['markerOutside'])
          PY
      - name: Audit A1.5 synthetic pressure A/B with original stable ink
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/a1
          python3 -m http.server 18771 --bind 127.0.0.1 > build/a1/pressure-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18771/animation/experiments/pressure-lab.html',timeout=1)" >/dev/null 2>&1; then break; fi
            sleep .2
          done
          options=(--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-timer-throttling --virtual-time-budget=120000 --window-size=1350,1700)
          timeout 180 "$CHROME_BIN" "${options[@]}" --dump-dom \
            'http://127.0.0.1:18771/animation/tests/pressure-lab-smoke.html' \
            > build/a1/pressure-lab-smoke-dom.html
          if ! grep -q 'data-result="PASS"' build/a1/pressure-lab-smoke-dom.html; then
            echo 'FAIL: pressure experiment changed original stable ink or pen states' >&2
            grep -o 'FAIL:[^<]*' build/a1/pressure-lab-smoke-dom.html | head -n 10 >&2 || true
            exit 1
          fi
          python3 - <<'PY'
          import html,json,re
          from pathlib import Path
          raw=Path('build/a1/pressure-lab-smoke-dom.html').read_text(encoding='utf-8')
          hit=re.search(r'<pre id="result">(\{.*?\})</pre>',raw,re.S)
          if not hit:
              raise SystemExit('Missing pressure laboratory JSON report')
          data=json.loads(html.unescape(hit.group(1)))
          assert data['result']=='PASS'
          assert data['glyphs']==6 and data['frames']==60
          assert data['inkPixelDifferences']==0
          assert data['markerSyncErrors']==0 and data['zeroOnset']==6
          assert data['pressureChanges']>=12 and data['nonzeroFrames']>=30
          assert data['pressureMeasured'] is False
          assert data['pressureCalibrated'] is False
          assert data['sourceGlyphsUnchanged'] and data['curvesVisible']
          Path('build/a1/pressure-lab-metrics.json').write_text(
            json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PASS: six source-backed glyphs, 60 real-browser ink-identical',
                'A/B frames, independent synthetic pressure and pressure chart')
          PY
          timeout 75 "$CHROME_BIN" "${options[@]}" --window-size=1440,1750 \
            --screenshot="$(pwd)/build/a1/pressure-lab-ab.png" \
            'http://127.0.0.1:18771/animation/experiments/pressure-lab.html' >/dev/null
          test -s build/a1/pressure-lab-ab.png
      - name: Verify two pressure styles on deployed primary animation player
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/a1
          python3 -m http.server 18772 --bind 127.0.0.1 > build/a1/pressure-style-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18772/animation/index.html',timeout=1)" >/dev/null 2>&1; then break; fi
            sleep .2
          done
          options=(--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-timer-throttling --window-size=1360,1680 --virtual-time-budget=120000)
          timeout 180 "$CHROME_BIN" "${options[@]}" --dump-dom \
            'http://127.0.0.1:18772/animation/tests/pressure-style-smoke.html' \
            > build/a1/pressure-style-smoke-dom.html
          if ! grep -q 'data-result="PASS"' build/a1/pressure-style-smoke-dom.html; then
            echo 'FAIL: main page pressure styles do not preserve stable ink' >&2
            grep -o 'FAIL:[^<]*' build/a1/pressure-style-smoke-dom.html | head -n 10 >&2 || true
            exit 1
          fi
          python3 - <<'PY'
          import html,json,re
          from pathlib import Path
          raw=Path('build/a1/pressure-style-smoke-dom.html').read_text(encoding='utf-8')
          match=re.search(r'<pre id="result">(\{.*?\})</pre>',raw,re.S)
          if not match:
              raise SystemExit('Missing structured primary-page style metrics')
          d=json.loads(html.unescape(match.group(1)))
          assert d['result']=='PASS'
          assert d['glyphs']==9 and d['frames']==45
          assert d['pixelMismatch']==0 and d['maskMismatch']==0
          assert d['markerMismatch']==0
          assert d['restoredTime']==45 and d['backToStable']==45
          assert d['meaningfulPressure']>=27
          assert d['stableDefault'] and d['mobile390']
          assert d['playingStatePreserved'] and d['sourceGlyphsUnchanged']
          assert d['pressureMeasured'] is False
          Path('build/a1/pressure-style-metrics.json').write_text(
              json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PASS: main-page stable/simulated selector, 9 glyphs / 45 frames,',
                'zero original red ink change, no playback reset, mobile layout valid')
          PY
      - name: Validate A2 basic-stroke motion and exact original ink in Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/a1
          python3 -m http.server 18773 --bind 127.0.0.1 > build/a1/a2-stroke-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18773/animation/experiments/stroke-grammar-lab.html',timeout=1)" >/dev/null 2>&1; then break; fi
            sleep .2
          done
