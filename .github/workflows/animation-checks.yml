name: A1 animation checks
on:
  push:
    paths:
      - 'animation/**'
      - 'scripts/a1_audit.py'
      - 'scripts/a1_browser_smoke.sh'
      - '.github/workflows/animation-checks.yml'
  pull_request:
    paths:
      - 'animation/**'
      - 'scripts/a1_audit.py'
      - 'scripts/a1_browser_smoke.sh'
      - '.github/workflows/animation-checks.yml'
permissions:
  contents: read
jobs:
  svg-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check JavaScript syntax and canonical stroke data
        run: |
          node --check animation/motion.js
          node --check animation/timeline.js
          node --check animation/player.js
          node --check animation/brush-union.js
          node --check animation/experiments/gesture-data.js
          node --check animation/experiments/pen-contact.js
          node --check animation/experiments/pen-lab-engine.js
          node --check animation/experiments/pen-kinematics.js
          node --check animation/gallery.js
          node --check animation/ui.js
          node --check animation/samples.js
          node --test animation/tests/timeline.test.cjs animation/tests/precision.test.cjs animation/tests/motion.test.cjs animation/tests/pen-contact.test.cjs animation/tests/pen-kinematics.test.cjs
      - name: Install CJK fallback solely for screenshot QA (never bundle font)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-uming fontconfig
      - name: Prepare headless Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Exercise true animated reveal and controller in a browser
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: bash scripts/a1_browser_smoke.sh
      - name: Render visual QA frame sheet (source-backed, no pedagogical approval)
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/a1
          python3 -m http.server 18766 --bind 127.0.0.1 > build/a1/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18766/animation/index.html',timeout=1)" >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          options=(--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-timer-throttling --window-size=1550,1620 --virtual-time-budget=16000)
          url="http://127.0.0.1:18766/animation/tests/frame-gallery.html"
          timeout 75 "$CHROME_BIN" "${options[@]}" --dump-dom "$url" > build/a1/gallery-dom.html
          grep -q 'data-result="PASS"' build/a1/gallery-dom.html
          timeout 75 "$CHROME_BIN" "${options[@]}" --screenshot="$(pwd)/build/a1/motion-frame-gallery.png" "$url" >/dev/null
          test -s build/a1/motion-frame-gallery.png
      - name: Verify pixel-by-pixel monotone ink growth on all sampled strokes
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/a1
          python3 -m http.server 18767 --bind 127.0.0.1 > build/a1/fill-integrity-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18767/animation/index.html',timeout=1)" >/dev/null 2>&1; then break; fi
            sleep .2
          done
          options=(--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-timer-throttling --disable-renderer-backgrounding --window-size=1300,1500 --virtual-time-budget=90000)
          timeout 180 "$CHROME_BIN" "${options[@]}" --dump-dom "http://127.0.0.1:18767/animation/tests/fill-integrity.html" > build/a1/fill-integrity-result.html
          if ! grep -q 'data-result="PASS"' build/a1/fill-integrity-result.html; then
            echo "A1 fill pixel-integrity check failed" >&2
            grep -o 'FAIL:[^<]*' build/a1/fill-integrity-result.html | head -n 8 >&2 || true
            exit 1
          fi
          echo "PASS: pixel-by-pixel monotone ink fill, no disconnected artifacts, original contour preserved"
      - name: Verify isolated A1.4 pen-contact A/B laboratory in Chromium
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/a1
          python3 -m http.server 18768 --bind 127.0.0.1 > build/a1/pen-lab-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18768/animation/experiments/pen-lab.html',timeout=1)" >/dev/null 2>&1; then break; fi
            sleep .2
          done
          options=(--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-timer-throttling --disable-renderer-backgrounding --window-size=1400,1750 --virtual-time-budget=60000)
          timeout 160 "$CHROME_BIN" "${options[@]}" --dump-dom "http://127.0.0.1:18768/animation/tests/pen-lab-smoke.html" > build/a1/pen-lab-smoke-dom.html
          if ! grep -q 'data-result="PASS"' build/a1/pen-lab-smoke-dom.html; then
            echo 'FAIL: A1.4 pen-contact browser audit' >&2
            grep -o 'FAIL:[^<]*' build/a1/pen-lab-smoke-dom.html | head -n 12 >&2 || true
            exit 1
          fi
          echo 'PASS: A1.4 six-glyph source-clipped synthetic nib A/B audit'
          python3 - <<'PY'
          import html
          import json
          from pathlib import Path
          import re
          raw = Path('build/a1/pen-lab-smoke-dom.html').read_text(encoding='utf-8')
          match = re.search(r'<pre id="result">(\{.*?\})</pre>', raw, re.S)
          if not match:
              raise SystemExit('Missing structured pen laboratory metrics')
          data = json.loads(html.unescape(match.group(1)))
          assert data['result'] == 'PASS'
          assert data['glyphs'] == 6 and data['sampledFrames'] == 60
          assert data['sourcePixelLoss'] == 0
          assert data['outsideOriginalContourPixels'] == 0
          assert data['invalidContactStates'] == 0
          assert data['retimedFrames'] >= 3
          assert data['worstExperimentalTerminalGapPercent'] < 10
          assert data['yiComparedFrames'] >= 5
          assert data['yiTrailingUnfilledPixels'] == 0
          assert data['yiTerminalGapPercent'] < 1.25
          Path('build/a1/pen-lab-metrics.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8')
          print('A1.4 metric gate:', json.dumps({
              key: data[key] for key in (
                  'sampledFrames','retimedFrames','sourcePixelLoss',
                  'outsideOriginalContourPixels','worstExperimentalTerminalGapPercent',
                  'yiComparedFrames','yiTrailingUnfilledPixels','yiTerminalGapPercent')
          }))
          PY
          timeout 120 "$CHROME_BIN" "${options[@]}" --dump-dom "http://127.0.0.1:18768/animation/tests/pen-lab-frames.html" > build/a1/pen-lab-frames-dom.html
          grep -q 'data-result="PASS"' build/a1/pen-lab-frames-dom.html
          timeout 120 "$CHROME_BIN" "${options[@]}" --window-size=1850,1620 --screenshot="$(pwd)/build/a1/pen-lab-ab-frames.png" "http://127.0.0.1:18768/animation/tests/pen-lab-frames.html" >/dev/null
          test -s build/a1/pen-lab-ab-frames.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-motion-frame-qa
          path: |
            build/a1/
            animation/
            data/B01.json
            data/B02.json
            data/B21.json
            data/teaching-source-policy.json
          if-no-files-found: warn
          retention-days: 14
