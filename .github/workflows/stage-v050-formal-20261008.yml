name: Stage audited v0.5.0 PDF blob (temporary)
on:
  push:
    branches:
      - release/v050-formal-20261008
    paths:
      - '.github/workflows/stage-v050-formal-20261008.yml'
      - 'scripts/build_v050_formal.py'
      - 'scripts/verify_v050_final.py'
permissions:
  contents: read
jobs:
  stage-exact-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed PDF renderer and font
        run: |
          python -m pip install PyMuPDF==1.26.7 numpy==2.4.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gkai00mp
      - name: Build deterministic edition and compare every page
        run: |
          python scripts/build_v050_formal.py --edit-log build/v0.5.0/edits.json
          python scripts/verify_v050_final.py --preflight --file build/v0.5.0/zitie-v0.5.0-A4.pdf --render --edits build/v0.5.0/edits.json
      - name: Create unreferenced audited PDF Git object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          pdf=pathlib.Path('build/v0.5.0/zitie-v0.5.0-A4.pdf').read_bytes()
          expected_sha256='10f5177221ff4817ea412f9e5f187e68d59eabfce8f94e2ebf4179f4398f6880'
          assert len(pdf)==7481279 and hashlib.sha256(pdf).hexdigest()==expected_sha256
          expected_blob=hashlib.sha1(b'blob '+str(len(pdf)).encode()+b'\0'+pdf).hexdigest()
          payload=json.dumps({'content':base64.b64encode(pdf).decode('ascii'),'encoding':'base64'}).encode()
          request=urllib.request.Request('https://api.github.com/repos/netplus/zitie/git/blobs',data=payload,
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json',
              'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request, timeout=120) as response:
            result=json.load(response)
          assert result['sha']==expected_blob, 'Git did not preserve exact PDF bytes'
          pathlib.Path('build/v0.5.0/staged-blob.json').write_text(json.dumps({
             'kind':'unreferenced_pdf_git_object_not_published',
             'sha256':expected_sha256,'bytes':len(pdf),'git_blob_sha':expected_blob,
             'ref':'release/v050-formal-20261008','head_sha':os.environ['GITHUB_SHA']},indent=2)+'\n')
          print('STAGED_PDF_BLOB_SHA='+expected_blob)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v050-formal-stage-receipt
          path: build/v0.5.0/staged-blob.json
          retention-days: 7
          if-no-files-found: error
