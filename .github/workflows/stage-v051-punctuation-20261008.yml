name: Stage exact v0.5.1 punctuation PDF Git blob (temporary)
on:
  push:
    branches:
      - maintenance/v051-punctuation-position-20261008
permissions:
  contents: read
jobs:
  stage:
    if: github.ref == 'refs/heads/maintenance/v051-punctuation-position-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact released font and PDF tooling
        run: |
          python -m pip install -r requirements.txt
          python -m pip install PyMuPDF==1.26.7 numpy==2.4.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gkai00mp fonts-arphic-uming fonts-dejavu-core fontconfig
      - name: Build SHA-bound v0.5.1 PDF from accepted RC3
        run: |
          python scripts/build_v051_punctuation.py --output build/v0.5.1/zitie-v0.5.1-A4.pdf
      - name: Stage exact PDF blob without updating any Git ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          path=pathlib.Path('build/v0.5.1/zitie-v0.5.1-A4.pdf')
          data=path.read_bytes()
          expected_sha='7fb6c7227258903828098c29368f0412a7b8621260d3d5f8ad91f45beba5eb90'
          expected_blob='5b2a95d6092b22b89617a6807cda1607f6b01b23'
          assert len(data)==7478502 and hashlib.sha256(data).hexdigest()==expected_sha
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==expected_blob
          payload=json.dumps({'content':base64.b64encode(data).decode('ascii'),'encoding':'base64'}).encode()
          req=urllib.request.Request('https://api.github.com/repos/netplus/zitie/git/blobs',data=payload,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=90) as res: reply=json.load(res)
          assert reply['sha']==expected_blob,reply
          receipt={'pdf_sha256':expected_sha,'pdf_blob_sha':expected_blob,'bytes':len(data),'staged_only':True,'source':'accepted RC3 finalcheck PDF','branch':os.environ['GITHUB_REF_NAME']}
          pathlib.Path('build/v0.5.1/temporary-blob-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('STAGED_EXACT_PDF_BLOB',json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zitie-v051-temporary-binary-staging
          path: build/v0.5.1/
          retention-days: 7
          if-no-files-found: error
