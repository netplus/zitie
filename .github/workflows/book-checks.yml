name: Book integrity checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gkai00mp fonts-arphic-uming fonts-dejavu-core fontconfig
      - name: Structural tests and tracked PDF checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          for N in $(seq -w 1 21); do BATCH="B$N"; python scripts/validate_project.py --batch "$BATCH"; done
          python scripts/test_validation.py
          python scripts/test_deliverables.py
          python scripts/verify_post_release.py --self-test
          python scripts/verify_post_release.py
          python scripts/verify_m2_reopens.py --self-test
          python scripts/verify_m2_reopens.py
          python scripts/verify_m2_pronunciation.py --self-test
          python scripts/verify_m2_pronunciation.py
          python scripts/verify_m2_closeout.py --self-test
          python scripts/verify_m2_closeout.py
          if [ -n "$BASE_SHA" ]; then
            python scripts/verify_deliverables.py --base-ref "$BASE_SHA"
          else
            python scripts/verify_deliverables.py
          fi
      - name: Build explicitly labelled research output
        run: |
          BATCHES="$(printf 'B%02d ' {1..21})"
          python scripts/acquire_vectors.py --batches $BATCHES
          python scripts/test_artwork.py
          FONT="$(fc-match -f '%{file}' 'AR PL KaitiM GB')"
          LATIN="$(fc-match -f '%{file}' 'DejaVu Sans')"
          for N in $(seq -w 1 21); do
            BATCH="B$N"
            python scripts/build_batch.py --draft --batch "$BATCH" --font "$FONT" --latin-font "$LATIN"
            python scripts/verify_pdf.py --batch "$BATCH"
          done
          python scripts/build_book_matter.py
          python scripts/build_collection.py
          python scripts/verify_book_matter.py
          python scripts/verify_release_candidate.py
          for N in $(seq -w 1 21); do
            BATCH="B$N"
            python scripts/build_batch.py --candidate --batch "$BATCH" --font "$FONT" --latin-font "$LATIN"
          done
          python scripts/build_collection.py --candidate
          python scripts/verify_release_candidate_pdf.py
          python scripts/verify_formal_release_gate.py
          for N in $(seq -w 1 21); do
            BATCH="B$N"
            python scripts/build_batch.py --formal --batch "$BATCH" --font "$FONT" --latin-font "$LATIN"
          done
          python scripts/build_book_matter.py --formal
          python scripts/build_collection.py --formal
          python scripts/verify_formal_release_pdf.py
          git rev-parse HEAD > build/SOURCE_COMMIT.txt
      - name: Build and check M1 patch candidate
        run: |
          FONT="$(fc-match -f '%{file}' 'AR PL KaitiM GB')"
          LATIN="$(fc-match -f '%{file}' 'DejaVu Sans')"
          VARIANT="$(fc-match -f '%{file}' 'AR PL UMing CN')"
          python scripts/build_patch_candidate.py --font "$FONT" --latin-font "$LATIN" --variant-font "$VARIANT"
          python scripts/verify_patch_candidate.py
          python scripts/test_patch_candidate.py
      - name: Build and check M1 formal preflight
        run: |
          python scripts/build_patch_release.py
          python scripts/verify_patch_release.py
          python scripts/test_patch_release.py
          python scripts/verify_patch_archive.py
      - name: Build and check M3 engineering preview
        run: |
          python scripts/acquire_m3_vectors.py
          python scripts/build_m3_preview.py
          python scripts/test_m3_migration.py
          python scripts/verify_m3_preview.py --self-test
          python scripts/verify_m3_preview.py
      - name: Build and check complete M3 release candidate
        run: |
          python scripts/build_m3_candidate.py
          python scripts/test_m3_candidate.py
          python scripts/verify_m3_candidate.py
          python scripts/verify_m3_archive.py
      - name: Check formal publication separately
        run: |
          for N in $(seq -w 1 21); do
            BATCH="B$N"
            if python scripts/validate_project.py --batch "$BATCH" --release; then
              echo "$BATCH release gates passed."
            else
              echo "$BATCH remains a research draft; no formal publication."
            fi
          done
      - name: Export editable project source without font files
        run: git archive --format=zip HEAD -o build/zitie-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zitie-p7-draft-rc1-formal-preflight
          path: build/
          retention-days: 14
          if-no-files-found: error

  stage-m3-candidate-blobs:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/m3-rc1-freeze-20261008'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zitie-p7-draft-rc1-formal-preflight
          path: input
      - name: Stage exact candidate bytes without changing repository refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          directory=pathlib.Path('input/v0.5.0-rc1')
          metadata=(directory/'generation.json').read_bytes(); meta=json.loads(metadata)
          assert meta['source_commit']==os.environ['GITHUB_SHA'] and not meta['source_dirty']
          assert meta['version']=='0.5.0-rc1' and meta['status']=='candidate_generated_not_archived'
          assert meta['candidate_frozen'] is False and meta['release_eligible'] is False and meta['Q1_completed'] is False
          raw=(directory/meta['pdf']).read_bytes()
          assert len(raw)==meta['bytes'] and hashlib.sha256(raw).hexdigest()==meta['sha256']
          def stage(data):
              payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              request=urllib.request.Request('https://api.github.com/repos/netplus/zitie/git/blobs',data=payload,
                headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response: value=json.load(response)
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert value['sha']==expected
              return expected
          record={'source_commit':meta['source_commit'],'source_tree':meta['source_tree'],'sha256':meta['sha256'],
                  'pages':meta['pages'],'bytes':meta['bytes'],'pdf_blob_sha':stage(raw),'generation_blob_sha':stage(metadata),
                  'generation_sha256':hashlib.sha256(metadata).hexdigest(),'status':'unreferenced_only_not_frozen'}
          out=pathlib.Path('staged');out.mkdir()
          (out/'candidate-blobs.json').write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m3-candidate-blob-references
          path: staged/
          retention-days: 7
