name: Book integrity checks
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gkai00mp fonts-dejavu-core fontconfig
      - name: Structural tests and tracked PDF checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          for N in $(seq -w 1 21); do BATCH="B$N"; python scripts/validate_project.py --batch "$BATCH"; done
          python scripts/test_validation.py
          python scripts/test_deliverables.py
          if [ -n "$BASE_SHA" ]; then
            python scripts/verify_deliverables.py --base-ref "$BASE_SHA"
          else
            python scripts/verify_deliverables.py
          fi
      - name: Build explicitly labelled research output
        run: |
          BATCHES="$(printf 'B%02d ' {1..21})"
          python scripts/acquire_vectors.py --batches $BATCHES
          python scripts/test_artwork.py
          FONT="$(fc-match -f '%{file}' 'AR PL KaitiM GB')"
          LATIN="$(fc-match -f '%{file}' 'DejaVu Sans')"
          for N in $(seq -w 1 21); do
            BATCH="B$N"
            python scripts/build_batch.py --draft --batch "$BATCH" --font "$FONT" --latin-font "$LATIN"
            python scripts/verify_pdf.py --batch "$BATCH"
          done
          python scripts/build_collection.py
          git rev-parse HEAD > build/SOURCE_COMMIT.txt
      - name: Check formal publication separately
        run: |
          for N in $(seq -w 1 21); do
            BATCH="B$N"
            if python scripts/validate_project.py --batch "$BATCH" --release; then
              echo "$BATCH release gates passed."
            else
              echo "$BATCH remains a research draft; no formal publication."
            fi
          done
      - name: Export editable project source without font files
        run: git archive --format=zip HEAD -o build/zitie-source.zip
      - name: Archive verified P7 full-book draft on archival branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/p7-full-book-draft-20261007'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/archive_full_book_draft.py
          git add deliverables/drafts/v0.3.0/B01-B21_with_preface_draft_A4.pdf deliverables/manifest.json reviews/v0.3.0-full-book-draft-ci.md
          if git diff --cached --quiet; then
            echo "Full-book draft already archived with identical bytes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[archive-draft] P7: archive full-book v0.3.0 draft"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zitie-p7-full-book-draft-research
          path: build/
          retention-days: 14
          if-no-files-found: error
