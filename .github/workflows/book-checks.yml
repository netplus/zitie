name: Book integrity checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Structural and negative tests
        run: |
          python scripts/validate_project.py
          python scripts/test_validation.py
      - name: Install rendering dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gkai00mp fonts-dejavu-core fontconfig
      - name: Build explicitly labelled research output
        run: |
          python scripts/acquire_vectors.py
          FONT="$(fc-match -f '%{file}' 'AR PL KaitiM GB')"
          LATIN="$(fc-match -f '%{file}' 'DejaVu Sans')"
          python scripts/build_batch.py --draft --font "$FONT" --latin-font "$LATIN"
          python scripts/verify_pdf.py
      - name: Check formal publication separately
        run: |
          if python scripts/validate_project.py --release; then
            echo 'Release gates passed.'
          else
            echo 'Research state only. No formal pages released.'
          fi
      - name: Export editable project source without font files
        run: git archive --format=zip HEAD -o build/zitie-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: zitie-B01-research
          path: build/
          retention-days: 14
          if-no-files-found: error
