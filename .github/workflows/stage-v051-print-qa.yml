name: Stage v0.5.1 nonrelease print QA sample blob
on:
  push:
    branches:
      - qa/v051-print-preflight-20261009
    paths:
      - '.github/workflows/stage-v051-print-qa.yml'
permissions:
  contents: read
jobs:
  stage:
    if: github.ref == 'refs/heads/qa/v051-print-preflight-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified print QA build dependencies
        run: |
          python -m pip install PyMuPDF==1.26.7 reportlab==4.4.9
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gkai00mp fonts-dejavu-core
      - name: Rebuild QA packet from published v0.5.1 and stage exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_v051_print_qa.py
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          path=pathlib.Path('qa/print/v0.5.1/v051-print-acceptance-samples-A4.pdf')
          raw=path.read_bytes()
          expected_sha256='b1261d047c7ecff1d253e8b5196eacb28d2491aeeb848d09b76123e3d55b9bfa'
          expected_git_blob='3ba4717841a6c923477fc886c8c06005ebfead88'
          assert len(raw)==3724579
          assert hashlib.sha256(raw).hexdigest()==expected_sha256, 'QA PDF differs from reviewed packet'
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==expected_git_blob
          payload=json.dumps({'content':base64.b64encode(raw).decode('ascii'),'encoding':'base64'}).encode()
          request=urllib.request.Request('https://api.github.com/repos/netplus/zitie/git/blobs',
            data=payload,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
               'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=90) as response:result=json.load(response)
          assert result['sha']==expected_git_blob, 'GitHub blob differs from exact local file'
          receipt={'sha256':expected_sha256,'git_blob_sha':expected_git_blob,
                   'size':len(raw),'pages':11,'source':'v0.5.1 exact published SHA256',
                   'physical_print_test_performed':False,'ref_changed':False}
          pathlib.Path('staged').mkdir(exist_ok=True)
          pathlib.Path('staged/v051-print-qa-blob.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v051-qa-blob-receipt
          path: staged/v051-print-qa-blob.json
          retention-days: 5
