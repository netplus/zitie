name: Prepare v0.2 editorial source and build review PDFs
on:
  push:
    branches: [feat/pdf-archive-b01-review]
    paths: [.github/workflows/stage-v02.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pdf-archive-b01-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record reviewed fields and migrate renderer exactly once
        run: |
          python maintenance/record_round2.py
          python maintenance/prepare_v02.py
          python -m compileall -q scripts maintenance
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/B01.json data/B02.json data/batches.json sources/catalog.json scripts/validate_project.py scripts/acquire_vectors.py scripts/build_batch.py scripts/verify_pdf.py book/front-matter/preface.md
          git commit -m 'feat: record B01 cross-review and prepare B02 two-source draft'
          git push origin HEAD:feat/pdf-archive-b01-review
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gkai00mp fonts-dejavu-core fontconfig
      - name: Build drafts without upgrading editorial status
        run: |
          python scripts/validate_project.py --batch B01
          python scripts/validate_project.py --batch B02
          python scripts/test_validation.py
          python scripts/verify_deliverables.py
          python scripts/test_deliverables.py
          python scripts/acquire_vectors.py --batches B01 B02
          FONT="$(fc-match -f '%{file}' 'AR PL KaitiM GB')"
          LATIN="$(fc-match -f '%{file}' 'DejaVu Sans')"
          for BATCH in B01 B02; do
            python scripts/build_batch.py --draft --batch "$BATCH" --font "$FONT" --latin-font "$LATIN"
            python scripts/verify_pdf.py --batch "$BATCH"
          done
          python scripts/build_collection.py
          git rev-parse HEAD > build/SOURCE_COMMIT.txt
          git archive --format=zip HEAD -o build/zitie-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: zitie-v02-layout-review
          path: build/
          retention-days: 14
          if-no-files-found: error
