name: Stage B02 reviewed correction v0.2.1
on:
  push:
    branches: [feat/b02-content-v021]
    paths: [maintenance/complete_b02_v021.py]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gkai00mp fonts-dejavu-core fontconfig
          python scripts/acquire_vectors.py --batches B01 B02
      - name: Record reviewed fields and exact renderer migration
        run: |
          python maintenance/complete_b02_v021.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data sources scripts book README.md CHANGELOG.md deliverables/README.md .github/workflows/book-checks.yml
          if ! git diff --cached --quiet; then
            git commit -m 'fix: complete B02 pronunciation and source-pinned stroke-terminal corrections'
            git push origin HEAD:refs/heads/feat/b02-content-v021
          fi
      - name: Validate and build review bytes
        run: |
          python scripts/test_validation.py
          python scripts/test_deliverables.py
          python scripts/test_artwork.py
          FONT="$(fc-match -f '%{file}' 'AR PL KaitiM GB')"
          LATIN="$(fc-match -f '%{file}' 'DejaVu Sans')"
          for BATCH in B01 B02; do
            python scripts/validate_project.py --batch "$BATCH"
            python scripts/build_batch.py --draft --batch "$BATCH" --font "$FONT" --latin-font "$LATIN"
            python scripts/verify_pdf.py --batch "$BATCH"
          done
          python scripts/build_collection.py
          git rev-parse HEAD > build/SOURCE_COMMIT.txt
          git archive --format=zip HEAD -o build/zitie-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: zitie-v021-layout-review
          path: build/
          retention-days: 14
          if-no-files-found: error
