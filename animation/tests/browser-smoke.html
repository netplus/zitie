<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>A1.2.1 real-browser precision + UI tests</title></head>
<body>
<h1>A1.2.1 behavior and pixel quality</h1>
<pre id="result">RUNNING</pre>
<iframe id="demo" title="Online writing preview" src="../index.html"
 style="width:1050px;height:1250px"></iframe>
<script>
const pause=ms=>new Promise(ok=>setTimeout(ok,ms));
function check(condition,message){
  if(!condition)throw new Error(message);
}
async function redPixels(svg,tip){
  const previous=tip.style.display;
  tip.style.display='none';
  try{
    const markup=new XMLSerializer().serializeToString(svg);
    const url=URL.createObjectURL(new Blob([markup],{type:'image/svg+xml;charset=utf-8'}));
    try{
      const image=new Image();
      await new Promise((ok,bad)=>{
        image.onload=ok;
        image.onerror=()=>bad(new Error('SVG rasterizer failed'));
        image.src=url;
      });
      const canvas=document.createElement('canvas');
      canvas.width=canvas.height=512;
      const ctx=canvas.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(image,0,0,512,512);
      const pixels=ctx.getImageData(0,0,512,512).data;
      let count=0;
      for(let i=0;i<pixels.length;i+=4)
        if(pixels[i]>140&&pixels[i+1]<115&&pixels[i+2]<125&&
           pixels[i]>pixels[i+1]*1.5&&pixels[i+3]>200)count++;
      return count;
    }finally{URL.revokeObjectURL(url);}
  }finally{tip.style.display=previous;}
}
document.getElementById('demo').addEventListener('load',async function(){
 try{
  const w=this.contentWindow,d=w.document,app=w.ZITIE_A1_APP;
  const $=id=>d.getElementById(id);
  const tile=id=>d.querySelector('button[data-glyph-id="'+id+'"]');
  check(app&&app.rows.length===1,'one glyph loaded on startup');
  check($('glyphGallery').querySelectorAll('button').length===9,'all nine gallery tiles');
  check(!d.querySelector('#glyphSelect'),'old dropdown removed');
  check(tile('1').getAttribute('aria-pressed')==='true','selected glyph is accessible');

  const svg=$('glyphStage');
  const t0=app.timeline.strokes[0];
  const pixels=[];
  for(const fraction of [0,.05,.25,.5,.75,.95]){
    app.seekElapsed(t0.startMs+t0.durationMs*fraction);
    pixels.push(await redPixels(svg,app.tip));
  }
  check(pixels[0]===0,'no full stroke flashes at 0%: '+pixels);
  check(pixels[1]>0,'visible controlled stroke onset at 5%: '+pixels);
  for(let i=2;i<pixels.length;i++)
    check(pixels[i]>=pixels[i-1],'ink coverage never shrinks during write: '+pixels);
  check(pixels[2]<pixels[4]*.75,'25% cannot prematurely display whole stroke: '+pixels);
  check(app.rows[0].profile.method==='outline-cross-section',
    'real browser did not resolve outline cross-sections');
  check(app.rows[0].profile.sampledWithFill>5,'fill hit-tests unexpectedly absent');

  // Exact reference outline is drawn directly when playback completes.
  const sourceD=app.timeline.glyph.strokes[0].outline;
  app.showAll();
  check(app.getState().phase==='finished'&&
    app.rows[0].solid.getAttribute('d')===sourceD,'final contour is exact');
  app.rows[0].solid.setAttribute('fill','#BD3945');
  const all=await redPixels(svg,app.tip);
  app.rows[0].solid.setAttribute('fill','#5C6269');
  check(all>0,'reference outline pixel count');
  check(pixels[5]/all>.75,'95% brush coverage too low: '+pixels[5]+'/'+all);

  // Real asynchronous browser frames still drive the same timeline.
  $('restart').click();
  check(app.playing&&app.elapsed===0,'restart begins from zero');
  for(let n=0;n<14&&app.elapsed===0;n++)await pause(110);
  // Headless Chrome may throttle RAF for a nested iframe while honoring
  // virtual setTimeout; verify the frame callback deterministically then.
  // This fallback is not evidence of a human-visible continuous frame rate.
  if(app.elapsed===0) {
    app.lastTick=100;
    app._tick(210);
  }
  check(app.elapsed>0,'animation frame callback cannot advance timeline');
  $('play').click();
  const hold=app.elapsed;
  await pause(100);
  check(!app.playing&&app.elapsed===hold,'pause should hold');
  $('play').click();
  check(app.playing,'resume should work');
  $('showAll').click();
  check(!app.playing&&app.getState().phase==='finished','show complete');

  const search=$('glyphSearch');
  search.value='水';
  search.dispatchEvent(new Event('input',{bubbles:true}));
  check($('glyphGallery').querySelectorAll('button').length===1,'glyph search filters');
  check(w.ZITIE_A1_GALLERY.getSelectedId()===77,'filtered selection tracks model');
  check(app.rows.length===4,'water has four strokes');
  const water=app.timeline;
  app.seekElapsed(water.strokes[0].startMs+water.strokes[0].durationMs*.35);
  const waterEarly=await redPixels(svg,app.tip);
  app.seekElapsed(water.strokes[0].startMs+water.strokes[0].durationMs*.82);
  const waterLater=await redPixels(svg,app.tip);
  check(waterLater>waterEarly&&waterEarly>0,'hook motion must grow ink instead of jumping');

  $('timelineSeek').value='650';
  $('timelineSeek').dispatchEvent(new Event('input',{bubbles:true}));
  check(!app.playing&&app.elapsed>=water.totalMs*.649,'interactive seek uses same timeline');

  search.value='';
  search.dispatchEvent(new Event('input',{bubbles:true}));
  const b21=Array.from($('batchFilters').querySelectorAll('button'))
    .find(b=>b.textContent.startsWith('B21'));
  check(!!b21,'B21 filter present');
  b21.click();
  check($('glyphGallery').querySelectorAll('button').length===1,'batch filter');
  check(w.ZITIE_A1_GALLERY.getSelectedId()===201,'complex radical chosen');
  check(app.rows.length===17,'17-stroke complex radical');
  check(svg.querySelectorAll('defs mask').length===17,'no previous glyph masks remain');
  check(app.rows[0].solid.getAttribute('d')===app.timeline.glyph.strokes[0].outline,
    'exact canonical silhouette');
  $('next').click();
  check(app.getState().index===1,'next stroke');
  $('previous').click();
  check(app.getState().index===0,'previous stroke');
  $('replayOne').click();
  check(app.playing&&app.singleEnd===app.timeline.strokes[0].endMs,'single repeat');
  app.lastTick=100;
  app._tick(100+app.timeline.strokes[0].durationMs/app.speed+5);
  check(!app.playing&&app.singleEnd===null,'single repeat deadline');
  $('showAll').click();
  check(app.rows.every((r,i)=>r.solid.getAttribute('d')===app.timeline.glyph.strokes[i].outline),
    'complex final silhouette byte-identical to source');

  const allFilter=Array.from($('batchFilters').querySelectorAll('button'))
    .find(b=>b.textContent.startsWith('全部'));
  allFilter.click();
  tile('37').click();
  check(w.ZITIE_A1_GALLERY.getSelectedId()===37,'click gallery tile selects 口');
  check(tile('37').getAttribute('aria-pressed')==='true','gallery active state persists');
  const fold=app.timeline.strokes[1];
  app.seekElapsed(fold.startMs+fold.durationMs*.5);
  check((await redPixels(svg,app.tip))>0,'continuous folded stroke visible');

  $('nextGlyph').click();
  check(w.ZITIE_A1_GALLERY.getSelectedId()===40,'next glyph');
  $('previousGlyph').click();
  check(w.ZITIE_A1_GALLERY.getSelectedId()===37,'previous glyph');
  tile('37').focus();
  tile('37').dispatchEvent(new KeyboardEvent('keydown',{key:'r',bubbles:true}));
  check(app.playing&&app.elapsed===0,'keyboard replay');
  app.pause();

  search.value='不存在';
  search.dispatchEvent(new Event('input',{bubbles:true}));
  check(!$('emptyState').hidden&&$('glyphGallery').children.length===0,'empty-state UI');
  $('clearSearch').click();
  check($('glyphGallery').children.length===9,'clear filters restores all tiles');
  check(svg.querySelectorAll('defs mask').length===app.rows.length,'no orphan SVG resources');
  // Responsive layout, real Chrome computation (not CSS syntax alone).
  this.style.width='400px';
  await pause(80);
  check(w.matchMedia('(max-width:900px)').matches,'mobile media query should match');
  const stageRect=d.querySelector('.workspace').getBoundingClientRect();
  const libraryRect=d.querySelector('.library').getBoundingClientRect();
  check(libraryRect.top>=stageRect.bottom-2,'mobile library must stack below player');
  this.style.width='1050px';
  search.focus();
  const playingBeforeInput=app.playing;
  search.dispatchEvent(new KeyboardEvent('keydown',{code:'Space',key:' ',bubbles:true}));
  check(app.playing===playingBeforeInput,'typing/search focus must not start playback');
  d.documentElement.setAttribute('data-renderer-quality','PASS');
  document.documentElement.setAttribute('data-result','PASS');
  $('state').setAttribute('data-pixel-progress',pixels.join(','));
  document.getElementById('result').textContent=
    'PASS: offline gallery, search, batch filters, keyboard, pen-tip bounds, precise mask pixel growth, final vector identity and timeline controls; red pixels='+pixels.join(',');
 }catch(error){
  document.documentElement.setAttribute('data-result','FAIL');
  document.getElementById('result').textContent='FAIL: '+(error.stack||String(error));
 }
});
</script>
</body></html>
