<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>P2.1b source-coordinate real ink: Chromium geometry and lifecycle QA</title>
</head><body><h1>P2.1b real transient learner blue ink QA</h1>
<pre id="result">RUNNING</pre>
<iframe id="demo" title="PDF-backed live drawing" src="../book.html?id=77"
 style="display:block;width:1366px;height:820px;border:0"></iframe>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const check=(ok,msg)=>{if(!ok)throw Error(msg)};
const within=(actual,expected,tolerance=1)=>Math.abs(actual-expected)<=tolerance;
document.getElementById('demo').addEventListener('load',async function(){
 const out=document.getElementById('result');
 try{
  const w=this.contentWindow,d=w.document,b=w.ZITIE_A3_BOOK,p=w.ZITIE_P21B;
  check(b&&p&&d.documentElement.dataset.p21bReady==='raw-pointer-canvas',
    'P2.1b did not initialize');
  const sourceJson=JSON.stringify(b.pack.glyphs);
  b.selectGlyph(77);
  b.setPressureStyle('simulated');
  const second=b.player.timeline.strokes[1];
  b.player.seekElapsed(second.startMs+second.durationMs*.42);
  const initialElapsed=b.player.elapsed;
  const firstGlyph=b.getGlyph().strokes[0],referenceSource=b.getGlyph().strokes;
  const sourceSVG=d.getElementById('paperSvg'),sourcePaths=sourceSVG.innerHTML;
  check(p.open(),'Cannot enter immersive source stage');
  const canvas=d.getElementById('practiceInk');
  const board=d.getElementById('practiceBoard');
  const ref=d.getElementById('practiceSvg');
  const group=ref.querySelector('[data-practice-source-transform]');
  check(canvas&&group&&w.getComputedStyle(canvas).touchAction==='none',
    'Only the real input Canvas should suppress touch scrolling');
  check(canvas.parentElement===board&&canvas!==sourceSVG,
    'User ink must be a separate canvas over reference SVG');
  check(ref.querySelectorAll('[data-practice-stroke-index]').length===4,
    'Water source contour count changed');
  const ms=w.ZitiePracticeTraceSession;
  check(ms.SOURCE_BOUNDS.maxY===900&&ms.SOURCE_BOUNDS.minY===-124,
    'Incorrect SVG source coordinate bounds');
  const pointClient=([x,y])=>{
    const m=group.getScreenCTM();
    const t=new w.DOMPoint(x,y).matrixTransform(m);
    return {clientX:t.x,clientY:t.y};
  };
  const ev=(name,pointerId,source,stamp,ptype='pen',isPrimary=true)=>{
    const z=pointClient(source);
    const e=new w.PointerEvent(name,{
      pointerId,pointerType:ptype,pressure:.72,tiltX:8,tiltY:-5,
      bubbles:true,cancelable:true,isPrimary,button:0,
      clientX:z.clientX,clientY:z.clientY,
    });
    // Real PointerEvents' timestamp is monotone; synthetic ones can have
    // tightly spaced timestamps, still nondecreasing in raw input.
    canvas.dispatchEvent(e);
    return e;
  };
  const median=firstGlyph.median;
  check(median.length>=2,'Missing PDF source median');
  const start=median[0],finish=median.at(-1);
  // Inspect the FULL transformed viewport, not guessed y = 1024-y.
  const center=[512,393],screen=pointClient(center);
  const actual=new w.DOMPoint(screen.clientX,screen.clientY)
    .matrixTransform(group.getScreenCTM().inverse());
  check(within(actual.x,center[0],.01)&&within(actual.y,center[1],.01),
    'Source inverse SVG matrix not exact');
  const wrongY=1024-(900-center[1]);
  check(Math.abs(wrongY-center[1])>100,'SVG inversion test is not discriminative');
  ev('pointerdown',5,start,0);
  ev('pointermove',6,[100,500],1,'touch',false); // ignored other finger
  for(let i=1;i<median.length;i++)ev('pointermove',5,median[i],i*12);
  ev('pointerup',5,finish,median.length*12);
  await wait(150);
  const points=p.getTrace();
  check(points.length>=2&&p.getState().input.phase==='review'&&
    p.getState().input.acceptedStrokes===0,
    'Completed input trace should remain an ungraded draft');
  check(points.every(x=>x.pointerType==='pen'&&x.pressureSource===
    'device-reported-unverified'),'Pen input provenance changed');
  check(within(points[0].pressure,.72,.005)&&points[0].tiltX===8,
    'Real input pressure/tilt mismatch (pressure='+points[0].pressure+
    ', tiltX='+points[0].tiltX+')');
  check(within(points[0].x,start[0],.5)&&within(points[0].y,start[1],.5),
    'First captured raw point not aligned with original water median');
  const last=points.at(-1);
  check(within(last.x,finish[0],.5)&&within(last.y,finish[1],.5),
    'Final captured raw point not aligned with source-space physical input');
  check(points.every((x,i)=>i===0||x.tMs>=points[i-1].tMs),
    'Contact sample clock went backwards');
  const metrics=p.getInkMetrics();
  check(metrics.paintedSamples===points.length&&metrics.backingWidth>100,
    'Blue Canvas did not render all recorded real input points');
  const pixel=(source)=>{
    const c=pointClient(source),r=canvas.getBoundingClientRect();
    const x=Math.max(0,Math.min(canvas.width-1,Math.round(
      (c.clientX-r.left)*canvas.width/r.width)));
    const y=Math.max(0,Math.min(canvas.height-1,Math.round(
      (c.clientY-r.top)*canvas.height/r.height)));
    return [...canvas.getContext('2d').getImageData(x,y,1,1).data];
  };
  const blue=px=>px[2]>px[0]+65&&px[2]>px[1]+32&&px[3]>80;
  check(blue(pixel(start))&&blue(pixel(finish)),
    'Real blue ink missing from actual contact endpoints');
  check(p.getState().noAutomaticScore&&p.getState().noPersistentWritingStorage,
    'P2.1b must never mark the trace as learned or persisted');
  const proof=[];
  for(const v of [{name:'desktop1366x820',width:1366,height:820},
     {name:'padLandscape1180x820',width:1180,height:820},
     {name:'padPortrait820x1180',width:820,height:1180},
     {name:'phone390x844',width:390,height:844},
     {name:'shortPhone390x667',width:390,height:667}]){
    this.style.width=v.width+'px';this.style.height=v.height+'px';
    await wait(220);
    const oldPoints=JSON.stringify(p.getTrace());
    // Force a high-DPI backing update even when ResizeObserver batches.
    w.dispatchEvent(new w.Event('resize'));await wait(95);
    check(JSON.stringify(p.getTrace())===oldPoints,
      v.name+': raw source samples mutated after orientation/resize');
    check(p.getInkMetrics().paintedSamples===points.length,
      v.name+': user ink disappeared after backing-store resize');
    check(blue(pixel(start))&&blue(pixel(finish)),
      v.name+': ink shifted from physical input position after resize');
    const a=board.getBoundingClientRect(),b=canvas.getBoundingClientRect();
    check(Math.abs(a.width-a.height)<3&&
      Math.abs(a.width-b.width)<3&&Math.abs(a.height-b.height)<3,
      v.name+': canvas/reference square geometry diverged');
    check(d.documentElement.scrollWidth<=w.innerWidth+2,
      v.name+': mobile horizontal overflow');
    proof.push({viewport:v.name,paperWidth:Math.round(a.width),
      canvasPx:canvas.width,inkSamples:p.getInkMetrics().paintedSamples,
      actualBlueOnInput:true,acceptedStrokes:0});
  }
  // Clearing a draft removes user blue ink but cannot change SOURCE SVG.
  d.getElementById('practiceReset').click();await wait(90);
  check(p.getTrace().length===0&&p.getState().input.phase==='ready'&&
    !blue(pixel(start)),'Rewrite must actually remove temporary ink');
  ev('pointerdown',9,start,1);
  ev('pointermove',9,finish,2);
  ev('pointercancel',9,finish,3);
  await wait(90);
  check(p.getTrace().length===0&&
    p.getState().input.acceptedStrokes===0&&
    p.getState().input.cancellations>=1,
    'Cancelled touch cannot be counted as a real written stroke');
  // Pointer down during resize must abort; previous complete draft remains
  // intact across resize only when no stroke is currently being written.
  ev('pointerdown',10,start,4);
  ev('pointermove',10,finish,5);
  w.dispatchEvent(new w.Event('resize'));await wait(90);
  check(p.getState().input.phase==='ready'&&p.getTrace().length===0,
    'Resize while drawing must cancel the partial pen trace');
  ev('pointerdown',11,start,6,'touch');
  ev('pointermove',11,finish,7,'touch');
  ev('pointerup',11,finish,8,'touch');
  await wait(80);
  check(p.getTrace().every(x=>x.pressure===null&&x.tiltX===null),
    'Generic touch pressure must not masquerade as a real sensor');
  p.reference(1);
  check(p.getTrace().length===0&&p.getState().referenceIndex===1,
    'Preview navigation should reset unconfirmed stroke draft');
  p.close();
  check(!p.getState().active&&p.getTrace().length===0&&
    !b.player.playing&&b.player.elapsed===initialElapsed&&
    b.getPressureStyle()==='simulated',
    'Exit must clear transient input but restore original A3 animation state');
  check(sourceSVG.innerHTML===sourcePaths,
    'Actual learner ink unexpectedly modified the original A3 SVG');
  check(JSON.stringify(b.pack.glyphs)===sourceJson&&
    referenceSource.every((s,i)=>s.outline===b.getGlyph().strokes[i].outline),
    'Published source outlines/medians mutated');
  document.documentElement.dataset.result='PASS';
  out.textContent=JSON.stringify({result:'PASS',characters:201,sourceStrokes:1045,
    rawOnly:true,sourceUnchanged:true,buttonClear:true,noAutoGrade:true,
    tracePoints:points.length,canvasPixelProof:true,
    cancellationSafe:true,noPersistentStorage:true,layoutProof:proof},null,2);
 }catch(err){
  document.documentElement.dataset.result='FAIL';
  out.textContent='FAIL: '+(err.stack||err);
 }
});
</script></body></html>
