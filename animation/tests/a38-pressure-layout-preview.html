<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>A3.8 live pressure beside the writing board — visual QA</title>
<style>body{margin:0;background:#f4f2ef;color:#2b3941;font:14px system-ui,"Microsoft YaHei",sans-serif}
h1{font-size:18px;margin:12px 16px}p{margin:8px 16px 14px;color:#69757c;font-size:12px}
#demo{display:block;margin:0 auto;border:1px solid #e5dede;border-radius:10px;background:#fff}
</style></head><body>
<h1>A3.8 · 书写中实时可见笔压风格与力度</h1>
<p>模拟力度只更新笔尖与图表，不改变字帖源墨迹。</p>
<iframe id="demo" title="201字同步笔压写字对照" src="../book.html?id=77"
 style="width:1280px;height:930px"></iframe>
<script>
const mobile=new URLSearchParams(window.location.search).has('mobile');
const frame=document.getElementById('demo');
if(mobile)frame.style.width='390px';
frame.addEventListener('load',function(){
 const w=this.contentWindow,app=w.ZITIE_A3_BOOK;
 if(!app||w.document.documentElement.dataset.a3Ready!=='201'){
  document.documentElement.dataset.result='FAIL';return;
 }
 app.setPressureStyle('simulated');
 const stroke=app.player.timeline.strokes[1];
 app.player.seekElapsed(stroke.startMs+stroke.durationMs*.51);
 document.documentElement.dataset.result='PASS';
});
</script>
</body></html>
