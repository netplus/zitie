<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>A1.6 deployed stable/synthetic pen-style integration tests</title></head>
<body><h1>A1.6 两档笔压风格与正式稳定墨迹兼容性</h1>
<pre id="result">RUNNING</pre>
<iframe id="demo" src="../index.html" title="Published animation page"
  style="width:1070px;height:1380px"></iframe>
<script>
const check=(ok,msg)=>{if(!ok)throw Error(msg);};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function redPixels(svg,player,controller,resolution=384){
 const tip=player.tip,prev=tip.style.display;
 const ring=controller.getRing(),before=ring?ring.style.display:null;
 tip.style.display='none';
 if(ring)ring.style.display='none';
 try{
  const raw=new XMLSerializer().serializeToString(svg);
  const blob=URL.createObjectURL(new Blob([raw],{type:'image/svg+xml;charset=utf-8'}));
  try{
   const img=new Image();
   await new Promise((ok,no)=>{
    img.onload=ok;img.onerror=()=>no(Error('SVG raster failed'));img.src=blob;
   });
   const cv=document.createElement('canvas');cv.width=cv.height=resolution;
   const cx=cv.getContext('2d',{willReadFrequently:true});
   cx.drawImage(img,0,0,resolution,resolution);
   const pixels=cx.getImageData(0,0,resolution,resolution).data;
   const flags=new Uint8Array(resolution*resolution);
   for(let i=0,j=0;i<pixels.length;i+=4,j++)
    if(pixels[i]>137&&pixels[i+1]<115&&pixels[i+2]<124&&
       pixels[i]>pixels[i+1]*1.48&&pixels[i+3]>190)flags[j]=1;
   return flags;
  }finally{URL.revokeObjectURL(blob);}
 }finally{
  tip.style.display=prev;
  if(ring)ring.style.display=before;
 }
}
function difference(a,b){
 check(a.length===b.length,'Raster resolution mismatch');
 let count=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])count++;
 return count;
}
document.getElementById('demo').addEventListener('load',async function(){
 const output=document.getElementById('result');
 try{
  const w=this.contentWindow,d=w.document;
  const app=w.ZITIE_A1_APP,style=w.ZITIE_A1_PEN_STYLE;
  const speed=w.ZITIE_A1_SPEED;
  check(app&&style&&speed,'Main page did not initialize stable A1 player');
  check(style.get()==='stable','Stable must be the launch default');
  const buttons=[...d.querySelectorAll('#penStyleOptions button')];
  check(buttons.length===2,'Expected exactly two style buttons');
  check(buttons.map(x=>x.textContent.trim()).join(',')==='稳定版,模拟笔压版',
    'Unexpected pressure style labels');
  check(buttons[0].getAttribute('aria-pressed')==='true'&&
    buttons[1].getAttribute('aria-pressed')==='false','Stable initial ARIA status');
  check(d.getElementById('pressureDetails').hidden,
    'Pressure chart must be hidden in stable default');
  check(style.getRing()===null,'Stable rendering should not add force halo');
  check(app.tip.getAttribute('r')==='8'&&
    app.tip.getAttribute('stroke')==='#FFFFFF','Original stable cursor changed');
  const source=w.ZITIE_SAMPLES.glyphs;
  check(source.length===9,'Nine source-backed glyphs required');
  const original=JSON.stringify(source);
  const indexByChar={'口':1,'水':0,'月':1,'龠':13};
  const fractions=[.06,.45,.91];
  let frames=0,pixelMismatch=0,maskMismatch=0,markerMismatch=0,
    meaningfulPressure=0,backToStable=0,activeStyleFrames=0,
    restoredTime=0,restoredGlyphs=0;
  const reports=[];
  for(const glyph of source){
   w.ZITIE_A1_GALLERY.selectGlyph(glyph);
   check(style.get()==='stable','Selection changed style unexpectedly');
   const stroke=indexByChar[glyph.character]??0;
   const entry=app.timeline.strokes[stroke];
   for(const t of fractions){
    const clock=entry.startMs+entry.durationMs*t;
    app.seekElapsed(clock);
    const baseState=app.getState();
    const originalMasks=[...app.svg.querySelectorAll('defs mask')]
      .map(x=>x.outerHTML).join('');
    const stable=await redPixels(app.svg,app,style);
    buttons[1].click();
    check(style.get()==='simulated'&&
      buttons[1].getAttribute('aria-pressed')==='true'&&
      buttons[0].getAttribute('aria-pressed')==='false',
      'Simulated style cannot be selected');
    const simulatedState=app.getState();
    check(Math.abs(app.elapsed-clock)<1e-6&&
      Math.abs(baseState.progress-simulatedState.progress)<1e-12&&
      baseState.index===simulatedState.index&&
      baseState.phase===simulatedState.phase,
      'Switching visual style changed playback position');
    const meta=style.getState();
    check(meta.mode==='simulated'&&meta.measured===false&&
      meta.pressure>=0&&meta.pressure<=1&&Number.isFinite(meta.pressure),
      'Simulated pressure misrepresented as measured or nonfinite');
    const ring=style.getRing();
    check(ring&&ring.parentNode===app.tip.parentNode&&
      ring.getAttribute('fill')==='none'&&
      !/white|#fff/i.test((ring.getAttribute('stroke')||'')+' '+
        (ring.getAttribute('fill')||'')),
      'Contact ring missing or covers ink with white');
    check(ring.getAttribute('cx')===app.tip.getAttribute('cx')&&
      ring.getAttribute('cy')===app.tip.getAttribute('cy'),
      'Ring not aligned with corrected stable cursor');
    check(d.getElementById('pressureDetails').hidden===false&&
      d.getElementById('pressureValue').textContent.endsWith('%'),
      'Main page must show normalized contact and curve');
    const canvas=d.getElementById('pressureCurve');
    const paint=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
    check(paint.some((v,i)=>i%4===0&&v<190),
      'Main page pressure curve is not rendered');
    const current=await redPixels(app.svg,app,style);
    const missed=difference(stable,current);
    pixelMismatch+=missed;
    check(missed===0,glyph.character+' frame '+t+
      ': stable red bitmap changed by '+missed+' pixels');
    const newMasks=[...app.svg.querySelectorAll('defs mask')]
      .map(x=>x.outerHTML).join('');
    if(originalMasks!==newMasks)maskMismatch++;
    check(originalMasks===newMasks,
      'Pressure style changed source-union mask geometry');
    const marker=w.ZitieTimeline.frameAt(app.timeline,clock);
    const c=app.rows[stroke].opticalFrontier?
      w.ZitieInkBrushUnion.visualFrontAt(
        app.rows[stroke].opticalFrontier,marker.progress).tip:marker.tip;
    const pos=[+app.tip.getAttribute('cx'),+app.tip.getAttribute('cy')];
    if(Math.hypot(pos[0]-c[0],pos[1]-c[1])>.002)markerMismatch++;
    check(markerMismatch===0,'Pressure tip did not follow stable optical cursor');
    if(meta.pressure>.08)meaningfulPressure++;
    activeStyleFrames++;frames++;
    buttons[0].click();
    check(style.get()==='stable'&&
      d.getElementById('pressureDetails').hidden&&
      app.tip.getAttribute('r')==='8'&&
      app.tip.getAttribute('fill')==='#BD3945'&&
      app.tip.getAttribute('stroke')==='#FFFFFF'&&
      app.tip.getAttribute('stroke-width')==='2.5',
      'Returning to stable failed to restore the exact pen cursor');
    check(!style.getRing()||!style.getRing().isConnected,
      'Hidden experimental overlay leaked into stable SVG');
    if(Math.abs(app.elapsed-clock)<1e-6)restoredTime++;
    backToStable++;
   }
   reports.push({glyph:glyph.character,strokes:glyph.strokes.length});
   restoredGlyphs++;
  }
  check(frames===source.length*fractions.length&&pixelMismatch===0&&
    maskMismatch===0&&markerMismatch===0&&meaningfulPressure>10,
    'Incomplete or nonidentical pressure styles');
  check(restoredTime===frames&&backToStable===frames&&restoredGlyphs===9,
    'Style switching lost time or glyph state');
  check(JSON.stringify(source)===original,'Main page modified canonical glyph samples');
  // A pressure setting survives glyph navigation, speed buttons and a
  // playing cursor, without resetting elapsed time.
  style.set('simulated');
  w.ZITIE_A1_GALLERY.selectGlyph(source.find(g=>g.character==='水'));
  check(style.get()==='simulated','Synthetic pressure lost on glyph navigation');
  const stage=app.timeline.strokes[0];
  app.seekElapsed(stage.startMs+stage.durationMs*.57);
  speed.set(2);
  const hold=app.elapsed,curGlyph=app.timeline.glyph,curIndex=app.getState().index;
  app.play();
  check(app.playing,'Cannot begin continuous playback');
  style.set('stable');
  check(app.playing&&app.elapsed===hold&&app.speed===2&&
    app.timeline.glyph===curGlyph&&app.getState().index===curIndex,
    'Changing style while playing changed state or paused playback');
  style.set('simulated');
  check(app.playing&&app.elapsed===hold&&app.speed===2,
    'Changing to pressure while playing reset speed or timeline');
  app.pause();
  app.seekElapsed(stage.startMs+stage.durationMs*.13);
  check(style.get()==='simulated'&&style.getState().pressure>0,
    'Pressure style lost on backward seek');
  app.showAll();
  check(style.get()==='simulated'&&style.getState().pressure===0&&
    (!style.getRing()||!style.getRing().isConnected),
    'Force halo should clear at finished glyph');
  app.restart();app.pause();
  check(style.get()==='simulated','Replay dropped preferred style');
  speed.set(1);
  // Responsive: the pressure panel must not force horizontal scroll.
  this.style.width='390px';
  await wait(100);
  check(Math.abs(w.innerWidth-390)<2,'390px viewport not applied');
  check(d.documentElement.scrollWidth<=w.innerWidth+2,
    'Pen style panel overflows mobile viewport');
  const chart=d.getElementById('pressureCurve').getBoundingClientRect();
  const details=d.getElementById('pressureDetails').getBoundingClientRect();
  check(chart.width<=details.width+2,
    'Pressure chart does not shrink on mobile');
  this.style.width='1070px';
  style.set('stable');
  check(style.get()==='stable'&&!style.getRing()?.isConnected,
    'Final state did not restore stable renderer');
  const report={result:'PASS',glyphs:restoredGlyphs,
    frames,pixelMismatch,maskMismatch,markerMismatch,restoredTime,
    backToStable,activeStyleFrames,meaningfulPressure,
    stableDefault:true,playingStatePreserved:true,mobile390:true,
    pressureMeasured:false,sourceGlyphsUnchanged:true,details:reports};
  document.documentElement.setAttribute('data-result','PASS');
  output.textContent=JSON.stringify(report,null,2);
 }catch(error){
  document.documentElement.setAttribute('data-result','FAIL');
  output.textContent='FAIL: '+(error.stack||String(error));
 }
});
</script></body></html>
