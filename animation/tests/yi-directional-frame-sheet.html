<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>A1.4.4 directional start contact visual audit</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:19px;background:#f6f7f8;font:13px system-ui,"Microsoft YaHei",sans-serif;color:#283843}
h1{margin:0;font-size:23px}p{margin:8px 0 16px;color:#6b7880}
#frames{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.card{border:1px solid #d9e0e3;background:white;border-radius:11px;padding:9px}
.heading{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:650;padding-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pane small{font-size:10px;color:#57646b}.pane canvas{width:100%;aspect-ratio:1.05;display:block;background:#fff}
#status{font-size:12px;color:#21634e;margin:12px 0}
iframe{position:absolute;left:-99999px;top:0;width:1100px;height:1400px}
</style></head><body>
<h1>一 · 起笔真实轮廓支撑点与沿笔势填充关键帧</h1>
<p>A=稳定 source-fit 几何（无位置指示）；B=实验性源轮廓切向扫墨＋可见深色笔尖。按同一<strong>空间弧长位置</strong>对比。</p>
<div id="status">RASTERIZING</div><main id="frames"></main>
<iframe id="lab" src="../experiments/pen-lab.html" title="Offline pen lab"></iframe>
<script>
async function cropSvg(svg,tip,withPen){
 const prior=tip.style.display;
 if(!withPen)tip.style.display='none';
 try{
   const raw=new XMLSerializer().serializeToString(svg);
   const uri=URL.createObjectURL(new Blob([raw],{type:'image/svg+xml;charset=utf-8'}));
   const image=new Image();
   try{
     await new Promise((resolve,reject)=>{
       image.onload=resolve;
       image.onerror=()=>reject(Error('SVG raster failed'));
       image.src=uri;
     });
     const full=document.createElement('canvas');
     full.width=full.height=1024;
     full.getContext('2d').drawImage(image,0,0,1024,1024);
     const out=document.createElement('canvas');
     out.width=220;out.height=210;
     // Original outline source y=900-SVG screen y; Yi starts x~107,y~398,
     // so the visible start cap is around SVG canvas (107,502).
     out.getContext('2d').drawImage(full,64,419,230,219,0,0,220,210);
     return out;
   }finally{URL.revokeObjectURL(uri);}
 }finally{tip.style.display=prior;}
}
function inverse(profile,target){
 if(target<=0)return 0;
 if(target>=1)return 1;
 let lo=0,hi=1;
 for(let i=0;i<45;i++){
   const mid=(lo+hi)/2;
   if(profile.progressAt(mid)<target)lo=mid;else hi=mid;
 }
 return (lo+hi)/2;
}
document.getElementById('lab').addEventListener('load',async function(){
 const status=document.getElementById('status');
 try{
  const lab=this.contentWindow.ZITIE_A14_LAB;
  if(!lab)throw Error('Lab did not initialize');
  const glyph=lab.glyphs.find(g=>g.character==='一');
  lab.select(glyph);
  const step=lab.experimental.timeline.strokes[0],
    row=lab.experimental.rows[0];
  if(!row.startCap||row.startCap.supportMethod!=='source-svg-boundary-arclength')
    throw Error('No source-derived contour point');
  const fractions=[0,.0001,.001,.003,.005,.01,.02,.03,.04,.05,.10];
  let frames=0;
  for(const p of fractions){
    const time=inverse(row.motionWarp,p);
    lab.seek(step.startMs+step.durationMs*time);
    const b=await cropSvg(lab.experimental.svg,lab.experimental.tip,true);
    lab.baseline.seekElapsed(step.startMs+step.durationMs*
      inverse(step.motion,p));
    const a=await cropSvg(lab.baseline.svg,lab.baseline.tip,false);
    const card=document.createElement('div');card.className='card';
    const title=document.createElement('div');title.className='heading';
    const label=document.createElement('span');
    label.textContent='一 · '+(p*100).toFixed(p<.01?3:1)+'% 笔距';
    const timeLabel=document.createElement('span');
    timeLabel.textContent=(time*100).toFixed(2)+'% 笔时';
    title.append(label,timeLabel);card.append(title);
    const comparison=document.createElement('div');comparison.className='row';
    for(const [caption,canvas] of [['A：旧几何',a],['B：新轮廓＋笔尖',b]]){
      const pane=document.createElement('div');pane.className='pane';
      const text=document.createElement('small');text.textContent=caption;
      pane.append(text,canvas);comparison.append(pane);
    }
    card.append(comparison);document.getElementById('frames').append(card);
    frames++;
  }
  if(frames!==11)throw Error('Incomplete onset frame sheet');
  document.documentElement.setAttribute('data-result','PASS');
  status.textContent='PASS · SVG真轮廓支撑点 (行进前) = ('+
    row.startCap.sourceStartPoint.map(x=>x.toFixed(2)).join(', ')+
    ') · 11组原位 A/B 帧';
 }catch(e){
  document.documentElement.setAttribute('data-result','FAIL');
  status.textContent='FAIL: '+String(e.stack||e);
 }
});
</script>
</body></html>
