<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>P2.2a continuous whole-word practice and stroke-order QA</title></head>
<body><h1>真实蓝墨整字连续书写、顺序判断与 IndexedDB</h1>
<pre id="result">RUNNING</pre>
<iframe id="demo" title="PDF reference whole character" src="../book.html?id=77"
 style="display:block;border:0;width:1366px;height:820px"></iframe>
<script>
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const check=(good,message)=>{if(!good)throw Error(message)};
const iframe=document.getElementById('demo'),out=document.getElementById('result');
iframe.addEventListener('load',async function initial(){
 iframe.removeEventListener('load',initial);
 try{
  const w=this.contentWindow,d=w.document,book=w.ZITIE_A3_BOOK,p=w.ZITIE_P22A;
  check(book&&p&&d.documentElement.dataset.p22aReady==='whole-word-v1',
    'New continuous handwriting stage not initialized');
  book.selectGlyph(77);
  book.setPressureStyle('simulated');
  const canonical=JSON.stringify(book.pack.glyphs);
  const originalSvg=d.getElementById('paperSvg').innerHTML;
  const glyph=book.getGlyph(),sourceHash=glyph.source_sha256;
  const pdfHash=book.pack.publication.sha256;
  check(p.open(),'Could not open source-backed handwriting stage');
  await p.whenReady();
  const canvas=d.getElementById('practiceInk'),svg=d.getElementById('practiceSvg');
  const group=()=>svg.querySelector('[data-practice-source-transform]');
  const state=()=>p.getState();
  const point=xy=>{
    const r=new w.DOMPoint(xy[0],xy[1]).matrixTransform(group().getScreenCTM());
    return {clientX:r.x,clientY:r.y};
  };
  function stroke(index,type='pen'){
    const median=glyph.strokes[index].median;
    const id=index+100+Math.floor(w.performance.now())%9999;
    const send=(kind,p)=>{
      const z=point(p);
      canvas.dispatchEvent(new w.PointerEvent(kind,{
        pointerId:id,pointerType:type,isPrimary:true,bubbles:true,
        cancelable:true,button:0,pressure:.71,tiltX:8,tiltY:-7,...z
      }));
    };
    send('pointerdown',median[0]);
    for(let k=1;k<median.length;k++)send('pointermove',median[k]);
    send('pointerup',median.at(-1));
  }
  const hasBlue=loc=>{
    const pos=point(loc),r=canvas.getBoundingClientRect();
    const px=Math.max(0,Math.min(canvas.width-1,
      Math.round((pos.clientX-r.left)*canvas.width/r.width)));
    const py=Math.max(0,Math.min(canvas.height-1,
      Math.round((pos.clientY-r.top)*canvas.height/r.height)));
    const rgb=canvas.getContext('2d').getImageData(px,py,1,1).data;
    return rgb[2]>rgb[0]+65&&rgb[2]>rgb[1]+30&&rgb[3]>80;
  };
  check(!d.getElementById('practiceAccept')&&
    state().progress.writtenStrokes===0&&
    !state().orderCheck,
    'No per-stroke confirmation button or early order correctness claim allowed');
  stroke(0);await p.whenSaved();await sleep(45);
  check(state().progress.currentIndex===1&&
    p.getWritten().length===1&&
    p.getInkMetrics().confirmedStrokes===1&&
    hasBlue(glyph.strokes[0].median[0])&&
    state().orderCheck===null,
    'First natural pen lift should automatically record one actual stroke');
  const firstRecord=JSON.stringify(p.getWritten()[0].samples);
  check(p.reference(3),'Read-only future stroke preview failed');
  stroke(3);
  check(state().progress.currentIndex===1&&p.getWritten().length===1,
    'Future source preview must not accept writing or invent order');
  check(p.returnToCurrent(),'Cannot return from reference preview');
  stroke(1,'touch');await p.whenSaved();
  check(state().progress.currentIndex===2&&
    p.getWritten()[1].samples.every(x=>x.pressure===null)&&
    !state().orderCheck,
    'Second natural lift should record touch data, not simulate real pressure');
  const viewports=[];
  for(const v of [
    {name:'padPortrait820x1180',w:820,h:1180},
    {name:'padLandscape1180x820',w:1180,h:820},
    {name:'phone390x844',w:390,h:844},
    {name:'shortPhone390x667',w:390,h:667}
  ]){
    iframe.style.width=v.w+'px';iframe.style.height=v.h+'px';
    await sleep(180);w.dispatchEvent(new w.Event('resize'));await sleep(60);
    check(p.getInkMetrics().confirmedStrokes===2&&
      hasBlue(glyph.strokes[0].median[0])&&
      JSON.stringify(p.getWritten()[0].samples)===firstRecord,
      v.name+': actual ink went missing or moved after resize');
    check(d.documentElement.scrollWidth<=w.innerWidth+2,
      v.name+': unexpected horizontal scroll');
    viewports.push({viewport:v.name,written:2,blue:true,
      boardPx:Math.round(canvas.getBoundingClientRect().width)});
  }
  // A cancel must never append an automatic stroke.
  const before=state().progress.currentIndex,median=glyph.strokes[2].median;
  const z1=point(median[0]),z2=point(median[1]);
  const fire=(kind,z)=>canvas.dispatchEvent(new w.PointerEvent(kind,{
    pointerId:777,pointerType:'pen',isPrimary:true,bubbles:true,
    cancelable:true,button:0,...z
  }));
  fire('pointerdown',z1);fire('pointermove',z2);fire('pointercancel',z2);
  await sleep(30);
  check(state().progress.currentIndex===before&&!p.getTrace().length,
    'Cancelled in-progress stroke was accidentally appended');
  // Actual saved strokes survive exit and new session, no confirmation.
  check(p.close(),'Cannot exit after all lifted strokes are saved');
  check(p.open(),'Could not reopen the writing scene');
  await p.whenReady();
  check(state().progress.currentIndex===2&&
    JSON.stringify(p.getWritten()[0].samples)===firstRecord,
    'IndexedDB lost input geometry or order after reopening');
  stroke(2);await p.whenSaved();
  stroke(3);await p.whenSaved();await sleep(40);
  check(state().progress.completed&&state().progress.writtenStrokes===4&&
    state().orderCheck?.status==='consistent'&&
    d.getElementById('practiceOrderResult').textContent.includes('参考顺序一致')&&
    p.getInkMetrics().confirmedStrokes===4,
    'Whole Water character did not auto-judge correct reference order');
  const shape=p.getWritten().map(x=>x.samples.length);
  check(p.close(),'Could not leave completed whole word');
  // New JS document must restore ALL raw points and recompute verdict.
  const loaded=new Promise(res=>iframe.addEventListener('load',res,{once:true}));
  iframe.src='../book.html?id=77&v=p22a-reload';
  await loaded;
  const w2=iframe.contentWindow,b2=w2.ZITIE_A3_BOOK,p2=w2.ZITIE_P22A;
  check(p2.open(),'Reopened document cannot load handwriting');
  await p2.whenReady();
  check(p2.getState().progress.writtenStrokes===4&&
    p2.getOrderCheck()?.status==='consistent'&&
    p2.getInkMetrics().confirmedStrokes===4&&
    JSON.stringify(p2.getWritten().map(x=>x.samples.length))===JSON.stringify(shape),
    'Hard reload lost real recorded strokes or cautiously evaluated outcome');
  check(p2.undo(),'Undo after whole character failed');
  await p2.whenSaved();
  check(p2.getState().progress.currentIndex===3&&
    p2.getOrderCheck()===null&&
    p2.getInkMetrics().confirmedStrokes===3,
    'Undo must remove last real stroke and clear old verdict');
  const d2=w2.document;
  d2.getElementById('practiceRestart').click();
  check(!d2.getElementById('practiceClearPrompt').hidden,
    'Whole-character restart must require destructive confirmation');
  d2.getElementById('practiceClearNo').click();
  check(p2.getState().progress.writtenStrokes===3,
    'Canceling deletion must preserve learner ink');
  d2.getElementById('practiceRestart').click();
  d2.getElementById('practiceClearYes').click();
  await p2.whenSaved();
  check(p2.getState().progress.currentIndex===0&&
    p2.getInkMetrics().confirmedStrokes===0,'Restart must clear recorded strokes');
  // Wrong order: exact water reference strokes in swapped input sequence.
  const g2=b2.getGlyph(),can=d2.getElementById('practiceInk'),
    srcg=()=>d2.querySelector('[data-practice-source-transform]');
  function next(index){
    const id=600+index;
    const send=(kind,xy)=>{
      const m=new w2.DOMPoint(...xy).matrixTransform(srcg().getScreenCTM());
      can.dispatchEvent(new w2.PointerEvent(kind,{
        bubbles:true,cancelable:true,isPrimary:true,pointerId:id,
        pointerType:'pen',button:0,pressure:.6,clientX:m.x,clientY:m.y
      }));
    };
    const med=g2.strokes[index].median;
    send('pointerdown',med[0]);
    for(const pt of med.slice(1))send('pointermove',pt);
    send('pointerup',med.at(-1));
  }
  for(const index of [1,0,2,3]){next(index);await p2.whenSaved();}
  check(p2.getOrderCheck()?.status==='reordered'&&
    JSON.stringify(p2.getOrderCheck()?.observed)==='[2,1,3,4]',
    'Four natural pen lifts in swapped order must NOT be called correct');
  // Browser retention and PDF/source integrity are independent of the verdict.
  check(JSON.stringify(b2.pack.glyphs)===canonical&&
    b2.pack.publication.sha256===pdfHash&&
    b2.getGlyph().source_sha256===sourceHash&&
    d.getElementById('paperSvg').innerHTML===originalSvg,
    'Unapproved geometry/source mutation detected');
  document.documentElement.dataset.result='PASS';
  out.textContent=JSON.stringify({result:'PASS',characters:201,
    sourceStrokes:1045,continuousNoConfirmation:true,
    genuineStrokeAutoCapture:true,correctOrder:'consistent',
    swappedOrder:'reordered',restoredFullWord:true,
    undoClearsVerdict:true,cancelSafe:true,noRemoteStorage:true,
    exactSourcePreserved:true,layout:viewports},null,2);
 }catch(error){
  document.documentElement.dataset.result='FAIL';
  out.textContent='FAIL: '+(error.stack||error);
 }
});
</script></body></html>
