<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>F2.3 real-wall-clock letter formation Chromium QA</title>
<style>body{margin:0}iframe{display:block;width:100%;height:850px;border:0}</style>
</head><body>
<iframe id="demo" src="../foundations/formation-browser-smoke.html"
 title="F2.3 real-time nested player regression"></iframe>
<pre id="result">RUNNING</pre>
<script>
const frame=document.getElementById('demo'),out=document.getElementById('result');
let done=false;
const copy=()=>{
 if(done)return;
 try{
  const child=frame.contentDocument;
  const result=child?.documentElement?.dataset?.result;
  if(result!=='PASS'&&result!=='FAIL')return;
  done=true;
  document.documentElement.dataset.result=result;
  out.textContent=child.getElementById('result')?.textContent||result;
 }catch(error){
  done=true;
  document.documentElement.dataset.result='FAIL';
  out.textContent='FAIL: '+String(error.stack||error);
 }
};
frame.addEventListener('load',()=>setInterval(copy,80));
setTimeout(()=>{if(!done){
 document.documentElement.dataset.result='FAIL';
 out.textContent='FAIL: real-clock formation test exceeded 25 seconds';
}},25000);
</script></body></html>
