<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A1.4 virtual nib A/B browser verification</title></head>
<body><h1>A1.4 isolated pen-contact A/B smoke</h1><pre id="result">RUNNING</pre>
<iframe id="lab" src="../experiments/pen-lab.html"
 style="width:1260px;height:1800px" title="source-backed nib comparison"></iframe>
<script>
const $=x=>document.getElementById(x);
function check(v,message){if(!v)throw Error(message);}
const fractions=[0,.02,.05,.15,.25,.5,.75,.90,.98,.995];
async function raster(svg,tip){
  const old=tip.style.display;tip.style.display='none';
  try{
    const raw=new XMLSerializer().serializeToString(svg);
    const u=URL.createObjectURL(new Blob([raw],{type:'image/svg+xml;charset=utf-8'}));
    try{
      const img=new Image();
      await new Promise((resolve,reject)=>{
        img.onload=resolve;img.onerror=()=>reject(Error('SVG decode failed'));img.src=u;
      });
      const can=document.createElement('canvas');can.width=can.height=384;
      const ctx=can.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(img,0,0,384,384);
      const px=ctx.getImageData(0,0,384,384).data;
      const flags=new Uint8Array(384*384);
      let count=0;
      for(let i=0,j=0;i<px.length;i+=4,j++){
        if(px[i]>137&&px[i+1]<115&&px[i+2]<124&&
           px[i]>px[i+1]*1.48&&px[i+3]>190){flags[j]=1;count++;}
      }
      return {flags,count};
    }finally{URL.revokeObjectURL(u);}
  }finally{tip.style.display=old;}
}
function lostPixels(a,b){
  let loss=0;
  for(let i=0;i<a.length;i++)if(a[i]&&!b[i])loss++;
  return loss;
}
function delta(a,b){return Math.max(0,a-b);}
$('lab').addEventListener('load',async function(){
 try{
   const w=this.contentWindow,lab=w.ZITIE_A14_LAB;
   check(lab&&lab.baseline&&lab.experimental,
     'Cannot find independently initialized A/B engines');
   check(lab.glyphs.length===6,'Expected six source-backed experimental radicals');
   const selectors=w.document.querySelectorAll('#glyphButtons button');
   check(selectors.length===6,'Six glyph buttons not displayed');
   const speeds=w.document.querySelectorAll('#speedButtons button[data-speed]');
   check(speeds.length===5,'A/B speed presets missing');
   for(const val of [.5,1,1.5,2,3,1]){
     lab.setSpeed(val);
     check(lab.speed===val,'Speed setter incorrect');
     check(Array.from(speeds).filter(b=>b.getAttribute('aria-pressed')==='true').length===1,
       'Exactly one A/B speed should be active');
   }
   const chart=w.document.getElementById('dynamicsChart');
   check(chart&&chart.width===1000,'A/B physical-state chart is missing');
   const image=chart.getContext('2d').getImageData(0,0,1000,200).data;
   let nonwhite=0;
   for(let i=0;i<image.length;i+=4)
     if(image[i+3]&&image[i]<230&&image[i+1]<230&&image[i+2]<230)nonwhite++;
   check(nonwhite>80,'Synthetic pressure and motion charts did not render');
   const guide=w.document.getElementById('toggleNib');
   check(!!guide&&guide.getAttribute('aria-pressed')==='true',
     'Visible pen must be restored by default');
   check(lab.experimental.showTip===true,'Source-guided pen is unexpectedly hidden');
   lab.seek(lab.experimental.timeline.strokes[0].durationMs*.30);
   check(lab.experimental.tip.style.display!=='none','Pen marker did not follow the stroke');
   const guideElements=lab.experimental.tip.querySelectorAll('*');
   check(guideElements.length>=2,'The visible pen no longer has a discernible nib silhouette');
   check(Array.from(guideElements).every(node=>
     !/white|#fff|#ffffff|rgb\\(255/i.test(
       String(node.getAttribute('fill'))+' '+String(node.getAttribute('stroke')))),
     'Visible guide must not draw a moving WHITE hole over original red ink');
   guide.click();
   check(lab.experimental.showTip===false&&guide.getAttribute('aria-pressed')==='false'&&
     lab.experimental.tip.style.display==='none','Optional pen guide did not hide');
   guide.click();
   check(lab.experimental.showTip===true&&guide.getAttribute('aria-pressed')==='true'&&
     lab.experimental.tip.style.display!=='none','Restored pen guide failed to reappear');
   const target={一:0,口:1,水:0,月:1,火:0,龠:13};
   let checks=0,priorLost=0,outside=0,sourceMismatch=0,invalidStates=0,retimedFrames=0;
   let yiTrailingUnfilledPixels=0,yiComparedFrames=0,yiTerminalGapPercent=null;
   let worstNearFinalGap=0,worstLabel='';
   const outcomes=[];
   const start=performance.now();
   for(const glyph of lab.glyphs){
     lab.select(glyph);
     check(lab.experimental.rows.length===glyph.expected_stroke_count,
       glyph.character+': experimental stroke count changed');
     check(lab.baseline.rows.length===glyph.expected_stroke_count,
       glyph.character+': stable source stroke count changed');
     check(lab.experimental.stats.stamps>0,
       glyph.character+': no nib impressions were prepared');
     const index=target[glyph.character];
     const row=lab.experimental.rows[index],ref=glyph.strokes[index];
     const stage=lab.experimental.timeline.strokes[index];
     if(glyph.character==='一'){
       check(row.startCap&&row.sourceSweep,'一 requires a source-derived start-cap sweep');
       check(row.startCap.kind==='source_contour_probed_directional_contact',
         'Start support was guessed rather than measured from original SVG');
       check(row.startCap.sourceStart < -7,
         'Original source ink begins before the first median coordinate');
       check(row.startCap.hitSamples>20,'SVG silhouette did not get probed');
       lab.seek(stage.startMs+stage.durationMs*.005);
       check(lab.experimental.tip.style.display!=='none',
         'Source-guided pen missing during the initial contact gesture');
       check(row.sourceSweep.getAttribute('d').startsWith('M '),
         'Directional onset mask does not grow from the original shape');
     }
     check(row.plan.kind==='synthetic_contact_experiment_not_measured',
       'Synthetic contact incorrectly presented as measured');
     check(row.plan.sourceDirectionModified===false,
       'Virtual nib changed source direction');
     check(row.reveal.getAttribute('d')===ref.outline,'Experimental outline mutated');
     check(row.plan.gesture.source==='engineering_heuristic_only',
       'Candidate gesture not labeled engineering-only');
     lab.seek(stage.startMs+stage.durationMs*.995);
     const originalMask=row.reveal.getAttribute('mask');
     row.reveal.removeAttribute('mask');row.reveal.style.display='';
     const full=await raster(lab.experimental.svg,lab.experimental.tip);
     row.reveal.setAttribute('mask',originalMask);
     lab.experimental.renderAt(lab.elapsed);
     check(full.count>0,'Source reference has no red pixels');
     let before=new Uint8Array(384*384),count99=0;
     for(const fraction of fractions){
       const time=stage.startMs+stage.durationMs*fraction;
       lab.seek(time);
       check(Math.abs(lab.baseline.elapsed-lab.elapsed)<1e-5,
         'Experiment and baseline no longer share the same elapsed time');
       if(fraction>.02&&fraction<.995){
         const baselineProgress=lab.baseline.getState().progress;
         const penProgress=lab.lastResult.progress;
         if(Math.abs(baselineProgress-penProgress)>.002)retimedFrames++;
       }
       const a=await raster(lab.baseline.svg,lab.baseline.tip);
       const b=await raster(lab.experimental.svg,lab.experimental.tip);
       // Regression for user-reported 一 gray gaps: at each spatial point
       // already TEN PERCENT behind the experimental nib, the reference
       // contour must be fully deposited. Compare at the *same arclength*,
       // not equal wall time (experimental fold/hook retiming intentionally
       // differs from the stable time mapping).
       if(glyph.character==='一'&&fraction>=.15){
         const experimentalDistance=lab.lastResult.progress;
         const trailingSource=Math.max(0,experimentalDistance-.10);
         const baselineProfile=lab.baseline.timeline.strokes[index].motion;
         let lo=0,hi=1;
         for(let iter=0;iter<38;iter++){
           const mid=(lo+hi)/2;
           if(baselineProfile.progressAt(mid)<trailingSource)lo=mid;
           else hi=mid;
         }
         lab.baseline.seekElapsed(stage.startMs+stage.durationMs*(lo+hi)/2);
         const targetOutline=await raster(lab.baseline.svg,lab.baseline.tip);
         const missing=lostPixels(targetOutline.flags,b.flags);
         yiTrailingUnfilledPixels+=missing;
         yiComparedFrames++;
         if(missing)throw Error('一 at '+fraction+
           ': '+missing+' source-shape pixels still gray behind virtual nib');
         // Restore shared-clock UI state for subsequent samples.
         lab.seek(time);
       }
       if(fraction===0)check(b.count===0,'Unexpected red blob at zero percent');
       if(fraction>=.5)check(a.count>0&&b.count>0,'Invisible pen paint mid-stroke');
       const vanished=lostPixels(before,b.flags);
       if(vanished>0){priorLost+=vanished;throw Error(glyph.character+
         ' at '+fraction+': '+vanished+' previously deposited red pixels vanished');}
       const leak=lostPixels(b.flags,full.flags);
       if(leak>0){outside+=leak;throw Error(glyph.character+
         ' at '+fraction+': '+leak+' red pixels lie outside original outline');}
       const sample=lab.lastResult.contact;
       if(sample.count<0||!Number.isFinite(sample.pressure)||sample.pressure<0||
          sample.pressure>1)invalidStates++;
       if(fraction===.995)count99=b.count;
       before=b.flags;
       checks++;
     }
     const gap=(full.count-count99)/full.count;
     if(glyph.character==='一'){
       yiTerminalGapPercent=+(gap*100).toFixed(3);
       check(gap<.0125,'一 still has unfilled original contour at 99.5%: '+
         (100*gap).toFixed(3)+'%');
     }
     if(gap>worstNearFinalGap){worstNearFinalGap=gap;worstLabel=glyph.character;}
     outcomes.push({glyph:glyph.character,strokes:glyph.expected_stroke_count,
       preparedImpressions:lab.experimental.stats.stamps,
       baselineSegments:lab.baseline.rows.reduce((sum,r)=>sum+r.profile.segments.length,0),
       sourceContourFallbackSamples:lab.experimental.stats.fallbackContourSamples,
       terminalGapPercent:+(gap*100).toFixed(2)});
     lab.seek(lab.total);
     check(lab.experimental.rows.every((r,i)=>
       r.solid.getAttribute('d')===glyph.strokes[i].outline),
       'Final source geometry diverged');
     check(lab.baseline.rows.every((r,i)=>
       r.solid.getAttribute('d')===glyph.strokes[i].outline),
       'Baseline reference geometry diverged');
   }
   check(invalidStates===0,'Nonfinite or invalid synthetic pen state');
   check(retimedFrames>=3,'Experimental gesture retiming did not actually change spatial timing');
   check(yiComparedFrames>=5&&yiTrailingUnfilledPixels===0,
     '一 did not pass trailing reference-coverage comparisons');
   // The experiment is not promoted to the default renderer, so a residual
   // gap is reported as calibration debt, not silently called perfect.
   check(worstNearFinalGap<.10,'Virtual footprint geometry misses excessive contour area');
   lab.select(lab.glyphs[2]);
   const stage=lab.experimental.timeline.strokes[0];
   lab.seek(stage.startMs+stage.durationMs*.60);
   const hold=lab.elapsed;
   speeds[3].click();
   check(lab.speed===2&&Math.abs(lab.elapsed-hold)<1e-5,
     'Direct speed selection changed shared timeline position');
   lab.setSpeed(1);
   lab.seek(lab.total);
   check(lab.lastResult.phase==='finished','Experiment cannot finish at reference outline');
   const stats={
     result:'PASS',engine:'A1.4_elliptical_virtual_nib_unreviewed',
     glyphs:lab.glyphs.length,sampledFrames:checks,retimedFrames,
     yiComparedFrames,yiTrailingUnfilledPixels,yiTerminalGapPercent,sourcePixelLoss:priorLost,
     outsideOriginalContourPixels:outside,invalidContactStates:invalidStates,
     worstExperimentalTerminalGapPercent:+(worstNearFinalGap*100).toFixed(2),
     worstExperimentalTerminalGapGlyph:worstLabel,
     elapsedWallMs:Math.round(performance.now()-start),
     outcomes
   };
   document.documentElement.setAttribute('data-result','PASS');
   $('result').textContent=JSON.stringify(stats,null,2);
 }catch(error){
   document.documentElement.setAttribute('data-result','FAIL');
   $('result').textContent='FAIL: '+(error.stack||String(error));
 }
});
</script></body></html>
