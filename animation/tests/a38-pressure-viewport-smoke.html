<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>A3.8 production pressure panel beside/above writing area geometry QA</title></head><body>
<h1>201 PDF glyphs · live pressure telemetry within handwriting viewport</h1>
<pre id="result">RUNNING</pre>
<iframe id="demo" title="201-glyph production brush stage" src="../book.html?id=77"
 style="display:block;width:1410px;height:930px;border:0"></iframe>
<script>
const check=(ok,msg)=>{if(!ok)throw Error(msg);};
const wait=ms=>new Promise(done=>setTimeout(done,ms));
const bounds=el=>el.getBoundingClientRect();
document.getElementById('demo').addEventListener('load',async function(){
 const out=document.getElementById('result');
 try{
  const w=this.contentWindow,d=w.document,app=w.ZITIE_A3_BOOK;
  check(d.documentElement.dataset.a3Ready==='201'&&
    app?.pack.glyphs.length===201,'PDF-backed main book failed to initialize');
  const stage=d.getElementById('writingStage'),
    paper=d.querySelector('.writingStage > .paper'),
    panel=d.querySelector('.writingStage > .pressureBox'),
    details=d.getElementById('pressureDetails'),
    buttons=[...d.querySelectorAll('#pressureStyleOptions button')];
  check(stage&&paper&&panel&&stage.children.length===2&&
    paper.nextElementSibling===panel,
    'Pressure section is not attached to the drawing stage');
  check(d.querySelectorAll('#pressureStyleOptions').length===1&&
    d.querySelectorAll('#pressureCurve').length===1,
    'The responsive layout duplicated interactive pressure controls');
  check(buttons.map(b=>b.textContent.trim()).join('|')==='稳定版|模拟笔压版',
    'Original pressure style labels were changed');
  check(buttons[0].getAttribute('aria-pressed')==='true'&&
    app.getPressureStyle()==='stable','Stable default was lost');
  check(app.player.frontGuard===true,'A3.6 source pigment guard is missing');
  const glyphs=JSON.stringify(app.pack.glyphs);
  app.setPressureStyle('simulated');
  const entry=app.player.timeline.strokes[1];
  app.player.seekElapsed(entry.startMs+entry.durationMs*.51);
  const clock=app.player.elapsed;
  check(!details.hidden&&app.getPressureState().pressure>.05,
    'Live simulated pressure details did not render');
  check(d.getElementById('pressureCurve').getContext('2d')
    .getImageData(0,0,640,114).data.some((v,i)=>i%4===0&&v<195),
    'Live pressure curve not drawn on canvas');
  const chart=d.getElementById('pressureCurve'),
    percentage=d.getElementById('pressureValue');
  const screenshots=[];
  // Wide desktop: pressure choices, numerical readout and graph stay
  // alongside (not below) the square writing surface.
  await wait(130);
  const p=bounds(paper),s=bounds(panel),graph=bounds(chart),pc=bounds(percentage);
  check(w.innerWidth>=1300,'Wide preview did not use desktop viewport');
  check(s.left>=p.right+5 && Math.abs(s.top-p.top)<14,
    'Desktop panel must sit BESIDE source calligraphy paper, not below');
  check(s.bottom<=p.bottom+14&&graph.width>=110&&graph.bottom<=s.bottom+2&&
    pc.bottom<=s.bottom+2,
    'Full simulated pressure details do not fit beside writing square');
  check(w.getComputedStyle(panel).position==='sticky',
    'Pressure panel must remain anchored while writing is scrolled');
  check(d.documentElement.scrollWidth<=w.innerWidth+2,
    'Desktop page overflows horizontally');
  screenshots.push({viewport:'desktop1410',paperW:p.width,panelW:s.width,
    pressureBeside:true,canvasInPanel:true});
  // With the writing area scrolled partway, the user should STILL see
  // the pressure indicator, not have to scroll down past the player.
  const paperY=bounds(paper).top+w.scrollY;
  w.scrollTo(0,paperY+p.height*.20);
  await wait(120);
  const stick=bounds(panel),meter=bounds(percentage);
  check(stick.top>=-2&&stick.top<105&&
    meter.top>=-2&&meter.bottom<=w.innerHeight,
    'Desktop writing scroll hides pressure telemetry');
  screenshots.push({viewport:'desktopScrolled',panelTop:stick.top,
    pressureVisible:true});
  check(app.player.elapsed===clock,
    'Moving the pressure UI changed original player time');
  // 1020px laptop: preserve the canvas width; move the small pressure
  // toolbar ABOVE the source square and keep telemetry laid out flat.
  this.style.width='1020px';w.scrollTo(0,0);
  await wait(170);
  const tp=bounds(paper),ts=bounds(panel),tc=bounds(chart);
  check(ts.bottom<=tp.top+1&&ts.width>=tp.width-2,
    'Tablet pressure controls should appear ABOVE writing paper');
  check(tc.bottom<=ts.bottom+2&&tc.width>=100,
    'Tablet graph is missing or outside visible pressure toolbar');
  check(d.documentElement.scrollWidth<=w.innerWidth+2,
    'Tablet layout forces horizontal scrolling');
  screenshots.push({viewport:'laptop1020',pressureAbove:true,
    paperW:tp.width,panelW:ts.width});
  // Phone viewport: compact strip remains visible while the user
  // is looking at the middle of the animated square.
  this.style.width='390px';w.scrollTo(0,0);
  await wait(180);
  const mp=bounds(paper),ms=bounds(panel),mc=bounds(chart);
  check(ms.bottom<=mp.top+1,
    'Mobile strip not above handwriting canvas');
  check(ms.height<=205,'Mobile pressure strip is too tall');
  check(mc.width>90&&mc.bottom<=ms.bottom+2,
    'Mobile graph is clipped or too small');
  check(d.documentElement.scrollWidth<=w.innerWidth+2,
    '390px pressure panel overflows the page');
  const mobilePaperY=bounds(paper).top+w.scrollY;
  w.scrollTo(0,mobilePaperY+mp.height*.23);
  await wait(150);
  const msScroll=bounds(panel),mPercentage=bounds(percentage);
  check(msScroll.top>=-2&&msScroll.top<=30&&
    mPercentage.top>=0&&mPercentage.bottom<=w.innerHeight,
    'Mobile force indicator leaves view while writing');
  check(bounds(paper).top<w.innerHeight&&bounds(paper).bottom>0,
    'Mobile handwriting paper not visible when observing pressure');
  screenshots.push({viewport:'mobile390',pressureAbove:true,
    stickyWithinPaper:true,panelHeight:ms.height,curveWidth:mc.width});
  // The same controller and SVG survive responsive re-layout. The
  // previous 201/1045 pressure and A3.6 pixels remain untouched.
  check(app.getPressureStyle()==='simulated'&&app.player.elapsed===clock&&
    app.getGlyph().main_id===77,'Responsive rearrangement reset source state');
  app.setPressureStyle('stable');
  check(details.hidden&&buttons[0].getAttribute('aria-pressed')==='true'&&
    !app.getPressureRing()?.isConnected,
    'Stable mode did not restore the original bare nib');
  app.setPressureStyle('simulated');
  app.selectGlyph(201);
  check(app.getPressureStyle()==='simulated'&&
    app.getGlyph().strokes.length===17,
    'Glyph navigation lost pressure selection');
  check(JSON.stringify(app.pack.glyphs)===glyphs,
    'Layout rearrangement altered PDF source glyphs');
  const result={result:'PASS',characters:201,sourceStrokes:1045,
    wideSideBySide:true,laptopAbove:true,mobileAbove:true,
    desktopScrollVisible:true,mobileScrollVisible:true,
    noDuplicateControls:true,mobile390:true,pressureCurveVisible:true,
    pressureStyleStatePreserved:true,pdfSourceImmutable:true,
    originalPigmentGuard:true,layoutProof:screenshots};
  document.documentElement.dataset.result='PASS';
  out.textContent=JSON.stringify(result,null,2);
 }catch(e){
  document.documentElement.dataset.result='FAIL';
  out.textContent='FAIL: '+(e.stack||e);
 }
});
</script></body></html>
