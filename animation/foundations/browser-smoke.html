<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>F1 independent browser smoke</title>
<style>body{margin:0}iframe{width:100%;height:700px;border:0}</style></head>
<body><iframe id="app" src="./index.html?group=tones&amp;item=tones-5"></iframe>
<pre id="result">RUNNING</pre>
<script>
const report=document.getElementById('result');
const frame=document.getElementById('app');
const errors=[];
function ok(condition,message){if(!condition)errors.push(message);}
function run(){
  const w=frame.contentWindow,d=w.document,app=w.ZITIE_FOUNDATIONS;
  ok(d.documentElement.dataset.foundationsReady==='f1','page ready');
  ok(Boolean(app),'test API');
  if(!app){finish();return;}
  ok(app.getCategory()==='tones'&&app.getEntry()==='tones-5','deep link works');
  ok(w.ZitieFoundations.validate().items===113,'all 113 printable items');
  ok(app.getRate()===.8,'default speed 0.8');
  ok(d.getElementById('tipText').textContent.includes('ü'),'tone hint');
  const board=d.getElementById('board'),canvas=d.getElementById('ink');
  ok(board.getBoundingClientRect().width>0,'visible practice grid');
  const r=canvas.getBoundingClientRect(),x=r.left+r.width*.45,y=r.top+r.height*.5;
  function p(type,px,py,id=73,pointerType='pen',primary=true){const e=new w.PointerEvent(type,{
    bubbles:true,cancelable:true,pointerId:id,pointerType,isPrimary:primary,
    button:0,buttons:type==='pointerup'||type==='pointercancel'?0:1,clientX:px,clientY:py
  });(type==='pointerdown'?canvas:w).dispatchEvent(e);}
  p('pointerdown',x,y);p('pointermove',x+9,y+7);p('pointerup',x+17,y+12);
  ok(app.getSavedStrokeCount()===1,'pen stroke saved on natural up');
  ok(d.getElementById('writeStatus').textContent.includes('已保存在本机'),'local storage status');
  d.getElementById('undo').click();
  ok(app.getSavedStrokeCount()===0,'undo works');
  // Touch Events are a fallback for iOS engines that lack usable pointerdown.
  const event=(name,changed,touches)=>{
    const e=new w.Event(name,{bubbles:true,cancelable:true});
    Object.defineProperty(e,'changedTouches',{value:changed});
    if(touches)Object.defineProperty(e,'touches',{value:touches});
    canvas.dispatchEvent(e);
  };
  event('touchstart',[{identifier:19,clientX:x,clientY:y}]);
  event('touchmove',[{identifier:19,clientX:x+8,clientY:y+6}]);
  event('touchend',[{identifier:19,clientX:x+15,clientY:y+11}]);
  ok(app.getSavedStrokeCount()===1,'touch fallback commits one trace');
  d.getElementById('clear').click();
  ok(app.getSavedStrokeCount()===0,'restart without confirmation');
  const touch=(id,dx=0,dy=0)=>({identifier:id,clientX:x+dx,clientY:y+dy});
  // A Chromium event-order simulation, NOT an actual iPhone/Edge test.
  const existingUA=Object.getOwnPropertyDescriptor(w.navigator,'userAgent');
  Object.defineProperty(w.navigator,'userAgent',{
    configurable:true,value:'Mozilla/5.0 (iPhone) EdgiOS/135.0.0'
  });
  // 1: EdgiOS Pointer Events only: no touchstart must not block the stroke.
  p('pointerdown',x,y,91,'touch');
  p('pointermove',x+7,y+5,91,'touch');
  p('pointerup',x+15,y+10,91,'touch');
  ok(app.getSavedStrokeCount()===1,'Edge pointer-only stroke survives');
  d.getElementById('clear').click();
  // 2: pointerdown then touchstart: handoff, and delayed pointerup ignored.
  p('pointerdown',x,y,92,'touch');
  event('touchstart',[touch(29)],[touch(29)]);
  p('pointermove',x+4,y+3,92,'touch');
  event('touchmove',[touch(29,9,6)],[touch(29,9,6)]);
  p('pointerup',x+17,y+11,92,'touch');
  event('touchend',[touch(29,17,11)],[]);
  ok(app.getSavedStrokeCount()===1,'Edge pointer-to-touch handoff commits once');
  d.getElementById('clear').click();
  // 3: Touch Events arrive first, then a pointer: never create two traces.
  event('touchstart',[touch(30)],[touch(30)]);
  p('pointerdown',x,y,93,'touch');
  p('pointerup',x+5,y+4,93,'touch');
  event('touchmove',[touch(30,7,6)],[touch(30,7,6)]);
  event('touchend',[touch(30,15,11)],[]);
  ok(app.getSavedStrokeCount()===1,'Edge touch-first has no duplicate pointer stroke');
  d.getElementById('clear').click();
  // 4: A second finger aborts rather than recording a ghost stroke.
  event('touchstart',[touch(31)],[touch(31)]);
  event('touchstart',[touch(32,8,4)],[touch(31),touch(32,8,4)]);
  event('touchend',[touch(31,10,7)],[touch(32,8,4)]);
  ok(app.getSavedStrokeCount()===0,'multitouch aborts without ink');
  // 5: An unrelated Touch cancel cannot abort the active finger.
  event('touchstart',[touch(33)],[touch(33)]);
  event('touchcancel',[touch(34)],[touch(33)]);
  event('touchend',[touch(33,10,6)],[]);
  ok(app.getSavedStrokeCount()===1,'unrelated touchcancel ignored');
  d.getElementById('clear').click();
  if(existingUA)Object.defineProperty(w.navigator,'userAgent',existingUA);
  else delete w.navigator.userAgent;
  // 6: In iOS Edge the native touchstart may be missing while
  // touchmove/touchend still arrive. Recover the SAME pointer-started ink.
  Object.defineProperty(w.navigator,'userAgent',{
    configurable:true,value:'Mozilla/5.0 (iPhone) EdgiOS/135.0.0'
  });
  p('pointerdown',x,y,95,'touch');
  event('touchmove',[touch(35,8,5)],[touch(35,8,5)]);
  p('pointerup',x+12,y+7,95,'touch'); // stale after handoff
  event('touchend',[touch(35,17,11)],[]);
  ok(app.getSavedStrokeCount()===1,'Edge touchmove handoff without touchstart commits once');
  d.getElementById('clear').click();
  // 7: No native move either: the real native touchend can finish the ink.
  p('pointerdown',x,y,96,'touch');
  event('touchend',[touch(36,15,10)],[]);
  ok(app.getSavedStrokeCount()===1,'Edge touchend-only handoff commits once');
  d.getElementById('clear').click();
  // 8: A canceled native gesture must never become a pen-up.
  p('pointerdown',x,y,97,'touch');
  event('touchcancel',[touch(37)],[]);
  ok(app.getSavedStrokeCount()===0,'Edge partial touchcancel must not save ink');
  if(existingUA)Object.defineProperty(w.navigator,'userAgent',existingUA);
  else delete w.navigator.userAgent;
  // 9: Browser toolbar resize without board geometry change keeps the stroke.
  p('pointerdown',x,y,94,'pen');
  w.dispatchEvent(new w.Event('resize'));
  p('pointerup',x+10,y+7,94,'pen');
  ok(app.getSavedStrokeCount()===1,'unchanged-size resize preserves ink');
  d.getElementById('clear').click();
  const tab=[...d.querySelectorAll('#tabs button')].find(b=>b.dataset.group==='numbers');
  tab.click();
  ok(app.getCategory()==='numbers','switch category');
  const square=d.getElementById('guide').querySelector('rect');
  ok(square!==null,'number square grid');
  ok(Math.abs(square.width.baseVal.value-square.height.baseVal.value)<=2,
     'number guide remains square rather than stretched');
  ok(app.getPrintedPageCount()===3,'10 number items print to 3 A4 pages');
  // Old child writing of 8 was captured against two separate circles.
  w.localStorage.setItem('zitie-foundations-f1:numbers-8',JSON.stringify({
    version:1,strokes:[[[.23,.31],[.41,.53]]]
  }));
  [...d.querySelectorAll('#items button')][8].click();
  ok(d.getElementById('writeStatus').textContent.includes('旧版练习笔迹'),
    'old numeral 8 writing retained but identified as previous-source ink');
  d.getElementById('clear').click();
  app.selectGroup('numbers');
  [...d.querySelectorAll('#items button')][8].click();
  ok(!d.getElementById('writeStatus').textContent.includes('旧版练习笔迹'),
    'explicit restart must clear mismatch annotation for this numeral only');
  ok([...d.querySelectorAll('#printRoot svg.printLine')].every(s=>s.viewBox.baseVal.width===1600),'all print rows use full A4 width');
  // F2.6b: real Chromium verifies LWT number formation, not merely grid.
  const numberTiles=[...d.querySelectorAll('#items button')];
  for(const digit of ['1','4','8']){
    numberTiles[Number(digit)].click();
    const strokes=[...d.querySelectorAll('#guide path[stroke="#b33b49"]')];
    const expected=w.ZitieFoundations.compose(digit,'squares').strokes;
    ok(strokes.length===expected.length,'number '+digit+' pen-down count matches model');
    ok(strokes.every((s,i)=>s.getAttribute('d')===expected[i].d),
       'number '+digit+' instructional path rendered unmodified');
    const printed=[...d.querySelectorAll('#printRoot svg.printLine path[stroke="#b03a49"]')];
    ok(printed.some(el=>el.getAttribute('d')===expected[0].d),
       'number '+digit+' A4 worksheet must use same instructional shape');
  }
  ok(w.ZitieFoundations.compose('8','squares').strokes.length===1,
     '8 must never be two disconnected rings');
  // F2.6c source separation: Pinyin b/q are TWO contacts, English b/q ONE.
  const previousInk='zitie-foundations-f1:initials-0';
  w.localStorage.setItem(previousInk,JSON.stringify({version:1,strokes:[[[.24,.28],[.42,.53]]]}));
  app.selectGroup('initials');
  ok(d.getElementById('writeStatus').textContent.includes('旧版练习笔迹'),
      'Old blue Pinyin ink retained with version mismatch warning');
  d.getElementById('clear').click();
  app.selectGroup('letters');app.selectGroup('initials');
  ok(!d.getElementById('writeStatus').textContent.includes('旧版练习笔迹'),
      'Reset explicitly clears legacy reference warning without touching other entries');
  const initialButtons=[...d.querySelectorAll('#items button')];
  const initialGroup=w.ZitieFoundations.groups.find(g=>g.key==='initials');
  for(const glyph of ['b','q']){
    const index=initialGroup.entries.findIndex(e=>e.text===glyph);
    initialButtons[index].click();
    const red=[...d.querySelectorAll('#guide path[stroke="#b33b49"]')];
    ok(red.length===2&&w.ZitieFoundations.compose(glyph).strokes.length===1,
       'Pinyin '+glyph+' MUST differ from English manuscript');
    ok(red.every((p,i)=>p.getAttribute('d')===
       w.ZitieFoundations.compose(glyph,'lines','pinyin').strokes[i].d),
       'Pinyin '+glyph+' rendered classroom source geometry');
  }
  app.selectGroup('finals');
  const finalA=[...d.querySelectorAll('#guide path[stroke="#b33b49"]')];
  ok(finalA.length===2&&w.ZitieFoundations.compose('a').strokes.length===1,
     'Pinyin a uses 2 pen contacts while English a remains 1');
  ok(w.ZitieFoundations.compose('ü','lines','pinyin').strokes.length===4,
     'Pinyin ü is two u contacts plus two dots');
  app.selectGroup('initials');
  ok(app.getPrintedPageCount()===6,'23 initials to 6 A4 pages');
  ok(d.getElementById('printRoot').querySelectorAll('.printLine').length===69,'3 rows per initial');
  ok(d.documentElement.scrollWidth<=d.documentElement.clientWidth+2,'no horizontal overflow');
  finish();
}
function finish(){
  document.documentElement.dataset.result=errors.length?'FAIL':'PASS';
  report.textContent=errors.length?'FAIL: '+errors.join('; '):'PASS: F1 Latin/Pinyin, touch and A4 print';
}
frame.addEventListener('load',()=>{try{run();}catch(e){errors.push(String(e.stack||e));finish();}});
setTimeout(()=>{if(!document.documentElement.dataset.result){errors.push('timeout');finish();}},12000);
</script></body></html>
